function figCircleParts() {
  return svg(260, 220, `
    ${circ(120, 110, 90, { fill: "var(--surface)" })}${dot(120, 110)}
    ${seg(120, 110, 183.6, 46.4, { c: "var(--accent)" })}${txt(162, 92, "r", { fill: "var(--accent)" })}
    ${seg(30, 110, 210, 110, { c: "var(--hi)", w: 2.5 })}${txt(70, 104, "diameter", { size: 11 })}
    ${seg(56.4, 173.6, 183.6, 173.6, { w: 2 })}${txt(120, 168, "chord", { size: 11 })}
    ${seg(250, 0, 250, 220, { c: "var(--muted)", w: 1.5 })}${seg(30, 20, 30, 200, { c: "var(--muted)", w: 1.5, dash: "4 3" })}
    ${txt(236, 30, "tangent", { size: 11, fill: "var(--muted)", a: "end" })}`, "Circle with radius, diameter, chord and tangent line");
}
function figInscribed() {
  // circle center (110,110) r 85; arc AB at bottom, central angle 100°, inscribed point C at top
  const P = d => { const a = d * Math.PI / 180; return [+(110 + 85 * Math.cos(a)).toFixed(1), +(110 + 85 * Math.sin(a)).toFixed(1)]; };
  const A = P(40), B = P(140), C = P(270);
  return svg(220, 220, `
    ${circ(110, 110, 85, { fill: "var(--surface)" })}
    ${seg(110, 110, ...A, { c: "var(--accent)" })}${seg(110, 110, ...B, { c: "var(--accent)" })}
    ${seg(...C, ...A, { c: "var(--hi)" })}${seg(...C, ...B, { c: "var(--hi)" })}
    ${dot(110, 110)}${dot(...A)}${dot(...B)}${dot(...C)}
    ${txt(110, 140, "100°", { fill: "var(--accent)", size: 12 })}${txt(110, 50, "50°", { fill: "var(--ink)", size: 12 })}
    ${txt(A[0] + 10, A[1] + 12, "A")}${txt(B[0] - 10, B[1] + 12, "B")}${txt(C[0], C[1] - 8, "C")}`, "Central angle 100 degrees and inscribed angle 50 degrees on the same arc");
}
function figTangent() {
  return svg(300, 180, `
    ${circ(80, 90, 60, { fill: "var(--surface)" })}${dot(80, 90)}
    ${seg(80, 90, 260, 90, { c: "var(--muted)", w: 1.5, dash: "4 3" })}
    ${seg(260, 90, 100, 33.4, { c: "var(--accent)" })}${seg(260, 90, 100, 146.6, { c: "var(--accent)" })}
    ${seg(80, 90, 100, 33.4)}${dot(260, 90)}${txt(270, 94, "P", { a: "start" })}
    ${txt(170, 52, "equal", { fill: "var(--accent)", size: 12 })}${txt(170, 140, "tangents", { fill: "var(--accent)", size: 12 })}${txt(78, 58, "r", { size: 12 })}`, "Two tangent segments from point P to a circle are equal, and each meets a radius at a right angle");
}

FORMULAS["geo-area"] = [
  { name: "Rectangle · parallelogram", eq: "lw · bh (h is perpendicular height)" },
  { name: "Triangle", eq: "½ × base × height", core: true },
  { name: "Trapezoid", eq: "½ (b₁ + b₂) h", core: true },
  { name: "Heron's formula", eq: "√(s(s − a)(s − b)(s − c)),  s = (a + b + c)/2", note: "13-14-15 → 84 is the favorite" },
  { name: "Triangle with two sides and the angle between", eq: "½ ab sin C  (sin 30° = ½, sin 90° = 1)" },
  { name: "Pick's theorem (lattice polygon)", eq: "A = I + B/2 − 1", core: true },
  { name: "Shoelace formula", eq: "A = ½ |Σ (xᵢ yᵢ₊₁ − xᵢ₊₁ yᵢ)|" },
  { name: "Prism or cylinder volume", eq: "base area × height · cylinder πr²h", core: true },
  { name: "Pyramid or cone volume", eq: "⅓ × base area × height · cone ⅓πr²h", core: true },
  { name: "Sphere", eq: "V = (4/3)πr³ · S = 4πr²", core: true },
  { name: "Box surface area", eq: "2(lw + lh + wh)" },
  { name: "Cylinder surface area", eq: "2πr² + 2πrh" },
  { name: "Cone surface area", eq: "πr² + πrℓ (ℓ = slant height)" },
  { name: "Scaling by k", eq: "area × k² · volume × k³", core: true },
];

function figTrapezoid() {
  return svg(260, 150, `
    ${poly([[60, 20], [160, 20], [230, 120], [20, 120]])}
    ${seg(60, 20, 60, 120, { c: "var(--accent)", dash: "5 3" })}${rightMark(60, 120, 1, -1, 10)}
    ${txt(110, 14, "b₁ = 6")}${txt(125, 138, "b₂ = 10")}${txt(72, 76, "h", { fill: "var(--accent)", a: "start" })}`, "Trapezoid with parallel sides 6 and 10 and height h");
}
function figShadedSquare() {
  return svg(170, 170, `
    <rect x="15" y="15" width="140" height="140" fill="var(--hi-soft)" stroke="var(--ink)" stroke-width="2"/>
    ${circ(85, 85, 70, { fill: "var(--surface)" })}${txt(85, 90, "16 − 4π shaded", { size: 11, fill: "var(--muted)" })}`, "A circle inscribed in a square with the four corners shaded");
}
function figPick() {
  const X = x => 20 + x * 30, Y = y => 140 - y * 30;
  let g = "";
  for (let x = 0; x <= 6; x++) for (let y = 0; y <= 4; y++) g += dot(X(x), Y(y), { r: 2.5, c: "var(--muted)" });
  g = poly([[X(0), Y(0)], [X(6), Y(0)], [X(0), Y(4)]], { fill: "var(--accent-soft)" }) + g;
  [[1, 1], [2, 1], [3, 1], [4, 1], [1, 2], [2, 2], [1, 3]].forEach(([x, y]) => g += dot(X(x), Y(y), { r: 4.5, c: "var(--accent)" }));
  return svg(220, 160, g, "Lattice triangle with 7 interior points");
}
function figSolids() {
  return svg(380, 150, `
    <ellipse cx="60" cy="30" rx="40" ry="12" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2"/>
    ${seg(20, 30, 20, 120)}${seg(100, 30, 100, 120)}
    <path d="M20 120 A40 12 0 0 0 100 120" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${txt(60, 145, "cylinder πr²h", { size: 11 })}
    ${pathEl("M150 120 L190 25 L230 120")}<ellipse cx="190" cy="120" rx="40" ry="12" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${seg(190, 25, 190, 120, { c: "var(--accent)", dash: "4 3", w: 1.5 })}
    ${txt(190, 145, "cone ⅓πr²h", { size: 11 })}
    ${circ(320, 75, 45, { fill: "var(--hi-soft)" })}<ellipse cx="320" cy="75" rx="45" ry="12" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
    ${txt(320, 145, "sphere (4/3)πr³", { size: 11 })}`, "Cylinder, cone, and sphere with their volume formulas");
}

FORMULAS["arith"] = [
  { name: "Order of operations", eq: "( ) → exponents → × ÷ left to right → + − left to right" },
  { name: "Distributive shortcut", eq: "a×b + a×c = a×(b + c)  ·  17×23 + 17×77 = 1700" },
  { name: "\"Of\" means multiply", eq: "20% of 35% of 400 = 0.2 × 0.35 × 400 = 28" },
  { name: "Percent change", eq: "(new − old) ÷ old × 100%", core: true },
  { name: "Successive percents", eq: "multiply the factors: +20% then −20% → 1.2 × 0.8 = 0.96", core: true },
  { name: "Ratio a : b", eq: "total = a + b parts; one part = total ÷ (a + b)", core: true },
  { name: "Chaining ratios", eq: "a:b = 2:3, b:c = 4:5 → a:b:c = 8:12:15" },
  { name: "Mean", eq: "mean = sum ÷ count  ·  sum = mean × count", core: true },
  { name: "Median", eq: "middle of the sorted list (average the two middles if even)" },
  { name: "Squares ending in 5", eq: "(10a + 5)² = a(a + 1) | 25  ·  65² = 4225" },
  { name: "Near-square products", eq: "(n − k)(n + k) = n² − k²  ·  48 × 52 = 2496", core: true },
  { name: "Unit conversion", eq: "multiply by fractions equal to 1  ·  1 yd² = 9 ft², 1 yd³ = 27 ft³" },
  { name: "Speed conversion", eq: "60 mph = 88 ft/s  ·  30 mph = 44 ft/s" },
];

function figTape(parts, labels, cap) {
  const W = 300, x0 = 40, unit = (W - x0 - 10) / parts.reduce((a, b) => a + b, 0);
  let g = "", y = 18;
  parts.forEach((n, r) => {
    g += txt(x0 - 8, y + 17, labels[r], { a: "end", size: 12 });
    for (let i = 0; i < n; i++) g += `<rect x="${x0 + i * unit}" y="${y}" width="${unit}" height="26" fill="${r ? "var(--hi-soft)" : "var(--accent-soft)"}" stroke="var(--ink)" stroke-width="1.5"/>`;
    y += 36;
  });
  return svg(W, y + 4, g, cap);
}

   CHAPTER: Rates, Work & Motion

FORMULAS["rates"] = [
  { name: "Distance, rate, time", eq: "d = r × t  ·  r = d ÷ t  ·  t = d ÷ r", core: true },
  { name: "Average speed", eq: "total distance ÷ total time (never the average of the speeds)", core: true },
  { name: "Same distance at speeds a and b", eq: "average speed = 2ab ÷ (a + b)" },
  { name: "Moving toward each other", eq: "closing speed = sum of the speeds", core: true },
  { name: "Chasing (same direction)", eq: "closing speed = difference of the speeds", core: true },
  { name: "Train passing a bridge", eq: "distance = bridge length + train length" },
  { name: "Work rates", eq: "rates add: 1/T = 1/a + 1/b  ·  together time = ab ÷ (a + b)", core: true },
  { name: "Fill and drain", eq: "net rate = fill rate − drain rate" },
  { name: "Mixtures", eq: "amount of pure stuff = percent × total amount", core: true },
  { name: "Clock hands", eq: "minute hand 6°/min · hour hand ½°/min · angle = |30h − 5.5m|", core: true },
  { name: "Hands overlap", eq: "every 12/11 hours (65 5/11 minutes)" },
  { name: "Calendar shift", eq: "365 days = 52 weeks + 1 day · leap year shifts 2 days" },
];

function figMeet() {
  return svg(320, 90, `
    ${seg(20, 50, 300, 50, { w: 3 })}
    ${dot(20, 50, { r: 6 })}${dot(300, 50, { r: 6 })}
    ${txt(20, 78, "A")}${txt(300, 78, "B")}
    ${pathEl("M40 30 L110 30", { c: "var(--accent)" })}<path d="M110 30 l-8 -5 v10 z" fill="var(--accent)"/>
    ${pathEl("M280 30 L210 30", { c: "var(--hi)" })}<path d="M210 30 l8 -5 v10 z" fill="var(--hi)"/>
    ${txt(75, 20, "40 mph", { fill: "var(--accent)", size: 12 })}${txt(245, 20, "50 mph", { fill: "var(--hi)", size: 12 })}
    ${txt(160, 78, "180 miles", { size: 12, fill: "var(--muted)" })}`, "Two cars 180 miles apart driving toward each other at 40 and 50 mph");
}

function figDice() {
  const rows = [];
  for (let a = 1; a <= 6; a++) {
    const r = [`<b>${a}</b>`];
    for (let b = 1; b <= 6; b++) r.push(a + b === 7 ? `<b style="color:var(--accent)">${a + b}</b>` : String(a + b));
    rows.push(r);
  }
  return tbl(["+", "1", "2", "3", "4", "5", "6"], rows);
}
function figUnitSquare() {
  const X = x => 30 + x * 160, Y = y => 180 - y * 160;
  return svg(220, 210, `
    <rect x="${X(0)}" y="${Y(1)}" width="160" height="160" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    ${poly([[X(0), Y(0)], [X(0.5), Y(0)], [X(0), Y(0.5)]], { fill: "var(--accent-soft)", c: "var(--accent)" })}
    ${txt(X(0.13), Y(0.13) + 4, "x+y<½", { size: 10 })}
    ${txt(X(0), Y(0) + 18, "0")}${txt(X(1), Y(0) + 18, "1")}${txt(X(0) - 12, Y(1) + 4, "1")}
    ${txt(X(0.5), Y(0) + 18, "x")}${txt(X(0) - 12, Y(0.5) + 4, "y")}`, "Unit square with the triangle x + y < 1/2 shaded");
}

function figChessCorners() {
  let g = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const cut = (r === 0 && c === 0) || (r === 7 && c === 7);
    g += `<rect x="${10 + c * 18}" y="${10 + r * 18}" width="18" height="18" fill="${cut ? "none" : (r + c) % 2 ? "var(--ink)" : "var(--surface)"}" stroke="${cut ? "var(--muted)" : "var(--ink)"}" stroke-width="${cut ? 1 : 0.6}" ${cut ? 'stroke-dasharray="3 2"' : ""}/>`;
  }
  return svg(164, 164, g, "Chessboard with two opposite corners removed; both removed squares are the same color");
}

    this.opened = this.lsGet(LS_OPEN, {});
    this.settings = this.lsGet(LS_SET, {});
    const db = await (window.claude?.use?.("db") ?? Promise.resolve(null)).catch(() => null);
    if (!db) return;
    this.db = db; this.mode = "shared";
    const fail = () => { this.mode = "local"; this.results = this.lsGet(LS_KEY, []); this.opened = this.lsGet(LS_OPEN, {}); this.settings = this.lsGet(LS_SET, {}); this.emit(); };
    db.collection("results").orderBy("date", "desc").limit(1000).onSnapshot(
      snap => { this.results = snap.docs.map(d => ({ _id: d.id, ...d.data() })); this.emit(); }, fail);
    db.collection("opened").limit(1000).onSnapshot(
      snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data().date; }); this.opened = o; this.emit(); }, fail);
    db.collection("settings").onSnapshot(
      snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); this.settings = o; this.lsSet(LS_SET, o); this.emit(); }, () => {});
    this.emit();
  },
  async add(rec) {
    if (this.mode === "shared") {
      try { await this.db.collection("results").add(rec); return "shared"; } catch { /* fall back to local */ }
    }
    const list = this.lsGet(LS_KEY, []); list.unshift(rec); this.lsSet(LS_KEY, list);
    if (this.mode === "local") this.results = list;
    this.emit();
    return "local";
  },
  async markOpened(student, lessonId) {
    const key = `${student}__${lessonId}`;
    if (this.opened[key]) return;
    const date = new Date().toISOString();
    this.opened[key] = date;
    if (this.mode === "shared") {
      try { await this.db.collection("opened").doc(key).set({ student, lessonId, date }); return; } catch { /* fall back */ }
    }
    const o = this.lsGet(LS_OPEN, {}); o[key] = date; this.lsSet(LS_OPEN, o);
  },
  async setSetting(student, patch) {
    this.settings = { ...this.settings, [student]: { ...this.settings[student], ...patch } };
    this.lsSet(LS_SET, this.settings);
    this.emit();
    if (this.mode === "shared") { try { await this.db.collection("settings").doc(student).set(this.settings[student]); } catch {} }
  },
  // delete results matching isResult and opened marks whose key matches isOpen, in both places they may live
  async reset(isResult, isOpen) {
    this.lsSet(LS_KEY, this.lsGet(LS_KEY, []).filter(r => !isResult(r)));
    const lo = this.lsGet(LS_OPEN, {}); for (const k of Object.keys(lo)) if (isOpen(k)) delete lo[k]; this.lsSet(LS_OPEN, lo);
    const goneR = this.results.filter(isResult), goneO = Object.keys(this.opened).filter(isOpen);
    this.results = this.results.filter(r => !isResult(r));
    this.opened = Object.fromEntries(Object.entries(this.opened).filter(([k]) => !isOpen(k)));
    this.emit();
    if (this.mode !== "shared") return true;
    const jobs = [...goneR.filter(r => r._id).map(r => this.db.collection("results").doc(r._id).delete()),
                  ...goneO.map(k => this.db.collection("opened").doc(k).delete())];
    const out = await Promise.allSettled(jobs);
    return out.every(o => o.status === "fulfilled");
  },
  emit() { this.listeners.forEach(f => f()); },
};

const strip = h => h.replace(/<[^>]+>/g, "");
const L = i => "ABCDE"[i];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function parseNum(s) {
  s = String(s).replace(/[°,\s$¢%]/g, "").replace(/[−–]/g, "-");
  if (!s) return NaN;
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/").map(Number); return a / b; }
  return Number(s);
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
const chapterById = id => CURRICULUM.find(c => c.id === id);
function lessonMeta(id) {
  for (const c of CURRICULUM) for (const g of c.groups) for (const l of g.lessons) if (l.id === id) return { chapter: c, group: g, lesson: l };
  return null;
}
const chapterLessons = c => c.groups.flatMap(g => g.lessons);
const readyLessons = c => chapterLessons(c).filter(l => LESSONS[l.id]);

/* A lesson's level is the easiest level of the test problems written for it. */
const LESSON_LEVEL = {};
for (const b of BANK) {
  const cur = LESSON_LEVEL[b.topic];
  if (!cur || LEVEL_ORDER.indexOf(b.level) < LEVEL_ORDER.indexOf(cur)) LESSON_LEVEL[b.topic] = b.level;
}
const lessonLevel = id => LESSON_LEVEL[id] || "mk56";
const capOf = student => LEVELS[store.settings[student]?.maxLevel] ? store.settings[student].maxLevel : "amc10";
const levelOK = (student, level) => LEVEL_ORDER.indexOf(level) <= LEVEL_ORDER.indexOf(capOf(student));
const inLevel = (student, id) => levelOK(student, lessonLevel(id));
const nameOf = k => (store.settings[k]?.name || "").trim() || k;
const lvlTag = id => `<span class="lvl" title="Lesson level">${LEVELS[lessonLevel(id)].short}</span>`;

function bestQuiz(student, lessonId) {
  const rs = store.results.filter(r => r.kind === "quiz" && r.lessonId === lessonId && r.student === student);
  return rs.length ? Math.max(...rs.map(r => r.correct / r.total)) : null;
}
/* soon | ready | opened | progress | complete */
function lessonStatus(student, id) {
  if (!LESSONS[id]) return { s: "soon", label: "soon" };
  const b = bestQuiz(student, id);
  if (b !== null && b >= COMPLETE_AT) return { s: "complete", label: `complete · ${Math.round(b * 100)}%`, best: b };
  if (b !== null) return { s: "progress", label: `in progress · ${Math.round(b * 100)}%`, best: b };
  if (store.opened[`${student}__${id}`]) return { s: "opened", label: "opened" };
  return { s: "ready", label: "ready" };
}
const statusTag = st => `<span class="tag st-${st.s}">${st.label}</span>`;
function chapterProgress(student, c) {
  const ready = readyLessons(c).filter(l => inLevel(student, l.id));
  const done = ready.filter(l => lessonStatus(student, l.id).s === "complete").length;
  return { ready: ready.length, total: Math.max(1, ready.length), done };
}

function go(view, extra = {}) {

function quizHTML(id, items, st) {
  return items.map((it, i) => {
    const ans = st.answers[i], graded = st.graded;
    let input;
    if (it.type === "mc") {
      input = `<div class="choices">${it.choices.map((c, j) => {
        let cls = "choice";
        if (graded && j === it.answer) cls += " right"; else if (graded && j === ans) cls += " wrong";
        return `<button class="${cls}" aria-pressed="${ans === j}" data-act="qpick" data-i="${i}" data-j="${j}" ${graded ? "disabled" : ""}><span class="L">${L(j)}</span>${c}</button>`;
      }).join("")}</div>`;
    } else {
      input = `<div class="row"><input class="numin" id="qi-${id}-${i}" aria-label="Answer to question ${i + 1}" data-act="qnum" data-i="${i}" inputmode="decimal" autocomplete="off" placeholder="Your answer" value="${ans ?? ""}" ${graded ? "disabled" : ""}>${it.unit ? `<span class="status">${it.unit}</span>` : ""}</div>`;
    }
    let fb = "";
    if (graded) {
      const ok = isRight(it, ans);
      const shown = it.type === "mc" ? `${L(it.answer)}. ${it.choices[it.answer]}` : it.answer;
      fb = `<div class="fb ${ok ? "ok" : "no"}"><b>${ok ? "Correct." : `Answer: ${shown}.`}</b> ${it.explain}</div>`;
    }
    return `<div class="q"><div class="q-h"><span class="q-n">Question ${i + 1}</span></div><p>${it.q}</p>${input}${fb}</div>`;
  }).join("");
}
function isRight(it, ans) {
  if (ans === undefined || ans === null || ans === "") return false;
  if (it.type === "mc") return ans === it.answer;
  return Math.abs(parseNum(ans) - parseNum(it.answer)) < 1e-6;
}

function resetBlock(scope, id, label, question) {

  return `<button class="btn ghost small danger" data-act="reset" data-scope="${scope}" data-id="${id}">${label}</button>`;

async function doReset({ scope, id, student }) {
  let ok;
  if (scope === "lesson") {
    ok = await store.reset(r => r.student === student && r.kind === "quiz" && r.lessonId === id, k => k === `${student}__${id}`);
    delete S.quizState[id];
  } else if (scope === "chapter") {
    const ids = new Set(chapterLessons(chapterById(id)).map(l => l.id));
    ok = await store.reset(r => r.student === student && ((r.kind === "quiz" && ids.has(r.lessonId)) || (r.kind === "test" && r.chapter === id)),
      k => k.startsWith(student + "__") && ids.has(k.slice(student.length + 2)));
    ids.forEach(i => delete S.quizState[i]);
  } else if (scope === "tests") {
    ok = await store.reset(r => r.student === student && r.kind === "test", () => false);
  } else if (scope === "learning") {
    ok = await store.reset(r => r.student === student && r.kind === "quiz", k => k.startsWith(student + "__"));

    ok = await store.reset(r => r.student === student, k => k.startsWith(student + "__"));
    S.quizState = {};
  }
  S.confirmReset = null; render();
  toast(ok ? `Reset done for ${nameOf(student)}` : "Some items couldn't be removed from the shared record. Try again.");
}

const GEN_REPEATS = 6; // a generator may appear up to this many times in one test, with different numbers
const inChap = (topic, chap) => chap === "all" || lessonMeta(topic)?.chapter.id === chap;
function testPool(level, chap) {
  return BANK.filter(b => b.level === level && inChap(b.topic, chap));
}
function genPool(level, chap) {
  return GENS.filter(g => g.level === level && inChap(g.topic, chap));
}
/* A test draws from hand-written problems and generators together, using each source
   once before any repeats. Hand-written choices are shuffled so the right letter is random.
   If a chapter is short at this level, it is topped up from the level just below. */
const prevLevel = level => LEVEL_ORDER[LEVEL_ORDER.indexOf(level) - 1];
const capacity = (level, chap) => level ? testPool(level, chap).length + GEN_REPEATS * genPool(level, chap).length : 0;
const poolSize = (level, chap) => capacity(level, chap) + capacity(prevLevel(level), chap);
function drawFrom(level, chap, k) {
  if (!level || k <= 0) return [];
  const gens = genPool(level, chap), list = shuffle([...testPool(level, chap).map(b => ({ b })), ...gens.map(g => ({ g }))]).slice(0, k);
  const gs = shuffle(gens);
  for (let i = 0; list.length < k && i < gs.length * (GEN_REPEATS - 1); i++) list.push({ g: gs[i % gs.length] });
  return list;
}
function drawTest(level, chap, n) {
  const main = drawFrom(level, chap, n), sources = shuffle([...main, ...drawFrom(prevLevel(level), chap, n - main.length)]);
  return sources.map(s => {
    if (s.g) return genProblem(s.g);
    const perm = shuffle(s.b.choices.map((_, j) => j));
    return { ...s.b, choices: perm.map(j => s.b.choices[j]), answer: perm.indexOf(s.b.answer) };
  });
}
function testShape(levelKey, poolSize) {
  const lv = LEVELS[levelKey];
  if (S.testLen === "full") { const n = Math.min(lv.count, poolSize); return { n, limit: Math.round(lv.minutes * 60 * n / lv.count) }; }
  const mins = S.testLen === "m25" ? 25 : 15;
  const want = Math.max(1, Math.round(mins * 60 / lv.secPerQ)), n = Math.min(poolSize, want);
  return { n, limit: n === want ? mins * 60 : Math.round(n * lv.secPerQ) };
}

function viewSetup() {

function startTest() {
  const { n, limit } = testShape(S.level, poolSize(S.level, S.testChapter));
  const pool = drawTest(S.level, S.testChapter, n);
  S.test = { level: S.level, len: S.testLen, student: S.student, qs: pool, answers: {}, hints: {}, cur: 0, start: Date.now(), limit, done: false, confirming: false };
  go("test");
  clearInterval(S.timer);
  S.timer = setInterval(tick, 1000);
}
function tick() {
  const t = S.test; if (!t || t.done) return clearInterval(S.timer);
  const left = t.limit - (Date.now() - t.start) / 1000;
  const el = $("#timer");
  if (el) { el.textContent = fmtTime(Math.max(0, left)); el.classList.toggle("low", left < 60); }
  if (left <= 0) finishTest(true);
}

  ${t.quitting ? `<div class="confirm" role="alertdialog" aria-label="Confirm quit"><span>Quit this test? Nothing will be saved.</span><div class="row"><button class="btn" data-act="tcancel">Keep working</button><button class="btn primary" data-act="tquitok">Quit</button></div></div>` : ""}`;

async function finishTest(timedOut = false) {
  const t = S.test; if (!t || t.done) return;
  t.done = true; clearInterval(S.timer);
  const timeSec = Math.min(t.limit, Math.round((Date.now() - t.start) / 1000));
  const items = t.qs.map((q, k) => ({ id: q.id, q: strip(q.q), topic: q.topic, your: t.answers[k] === undefined ? null : L(t.answers[k]) + ". " + strip(q.choices[t.answers[k]]), correct: L(q.answer) + ". " + strip(q.choices[q.answer]), ok: t.answers[k] === q.answer, hint: !!t.hints[k] }));
  const rec = {
    kind: "test", student: t.student, level: t.level, title: LEVELS[t.level].name, date: new Date().toISOString(),
    chapter: S.testChapter, length: t.len, total: t.qs.length, correct: items.filter(x => x.ok).length, hintsUsed: items.filter(x => x.hint).length,
    timeSec, timeLimitSec: t.limit, timedOut,
    missed: items.filter(x => !x.ok).map(({ id, q, your, correct, hint, topic }) => ({ id, q, your, correct, hint, topic })),
  };
  S.lastResult = { rec, test: t };
  S.test = null;
  go("result");
  const where = await store.add(rec);
  toast(where === "shared" ? `Saved to ${nameOf(rec.student)}'s record` : `Saved in this browser for ${nameOf(rec.student)}`);
}

    <div class="row" style="justify-content:space-between"><h3>Lesson status</h3>${statusLegend()}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Lesson</th>${people.map(p => `<th>${nameOf(p)}</th>`).join("")}</tr></thead><tbody>
      ${chaps.map(c => `<tr class="chap-row"><td colspan="${people.length + 1}">${c.title}</td></tr>${readyLessons(c).map(l => `<tr><td><button class="linkish" data-act="lesson" data-id="${l.id}">${l.title}</button> ${lvlTag(l.id)}</td>${people.map(p => `<td>${inLevel(p, l.id) ? statusTag(lessonStatus(p, l.id)) : `<span class="status">above level</span>`}</td>`).join("")}</tr>`).join("")}`).join("")}
    </tbody></table></div>
  </section>
  ${who === "All" ? `<p class="status">To reset someone's progress, pick their name above. Single lessons and chapters can be reset from their own pages.</p>`
    : `<section class="panel" style="display:flex;flex-direction:column;gap:10px"><h3>Start over</h3>
      ${resetBlock("all", who, `Reset all of ${nameOf(who)}'s progress`, `Erase every test, lesson check, and "opened" mark for ${nameOf(who)}? Their name and level stay.`)}</section>`}`;
}

/* =========================================================
   RENDER + EVENTS
   ========================================================= */
function render() {
  renderChrome();
  const v = { home: viewHome, learn: viewLearn, chapter: viewChapter, lesson: viewLesson, formulas: viewFormulas, setup: viewSetup, test: viewTest, result: viewResult, progress: viewProgress, profile: viewProfile }[S.view] || viewHome;
  app.innerHTML = v();
}

app.addEventListener("submit", e => {
  const f = e.target.closest('[data-form="name"]'); if (!f) return;
  e.preventDefault();
  const v = $("#pname").value.trim().slice(0, 24);
  document.activeElement?.blur?.();
  store.setSetting(S.student, { name: v === S.student ? "" : v }); toast(`Saved: ${v || S.student}`);
});
app.addEventListener("input", e => {
  const el = e.target.closest('[data-act="qnum"]'); if (!el) return;
  S.quizState[S.lessonId].answers[+el.dataset.i] = el.value;
});
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, t = S.test;
  switch (a) {
    case "go": go(b.dataset.v); break;
    case "lesson": go("lesson", { lessonId: b.dataset.id }); break;
    case "chapter": go("chapter", { chapterId: b.dataset.id }); break;
    case "qpick": { const st = S.quizState[S.lessonId]; st.answers[+b.dataset.i] = +b.dataset.j; render(); break; }
    case "qretry": S.quizState[S.lessonId] = { answers: {}, graded: false }; render(); document.getElementById("check")?.scrollIntoView(); break;
    case "qcheck": {
      const les = LESSONS[S.lessonId], st = S.quizState[S.lessonId];
      st.graded = true;
      const res = les.quiz.map((it, i) => ({ it, i, ok: isRight(it, st.answers[i]) }));
      const blank = v => v === undefined || v === "";
      const rec = { kind: "quiz", student: S.student, lessonId: S.lessonId, title: les.title, date: new Date().toISOString(), total: les.quiz.length, correct: res.filter(r => r.ok).length,
        missed: res.filter(r => !r.ok).map(({ it, i }) => ({ id: S.lessonId + "-" + (i + 1), q: strip(it.q), your: blank(st.answers[i]) ? null : (it.type === "mc" ? strip(it.choices[st.answers[i]]) : String(st.answers[i])), correct: it.type === "mc" ? strip(it.choices[it.answer]) : String(it.answer) })) };
      const where = store.add(rec);
      render();
      if ((await where) === "local" && store.mode === "shared") toast("Couldn't reach the shared record; saved in this browser");
      break;
    }
    case "level": S.level = b.dataset.k; render(); break;
    case "tlen": S.testLen = b.dataset.k; render(); break;
    case "tchap": S.testChapter = b.dataset.id; render(); break;
    case "start": startTest(); break;
    case "tpick": t.answers[t.cur] = +b.dataset.j; render(); break;
    case "thint": t.hints[t.cur] = true; render(); break;
    case "tjump": t.cur = +b.dataset.i; t.confirming = t.quitting = false; render(); break;
    case "tprev": t.cur--; render(); break;
    case "tnext": t.cur++; render(); break;
    case "tsubmit": t.confirming = true; t.quitting = false; render(); break;
    case "tquit": t.quitting = true; t.confirming = false; render(); break;
    case "tcancel": t.confirming = t.quitting = false; render(); break;
    case "tconfirm": finishTest(false); break;
    case "tquitok": clearInterval(S.timer); S.test = null; go("setup"); break;
    case "pwho": S.progressWho = b.dataset.s; S.openAttempt = null; S.confirmReset = null; render(); break;
    case "nameclear": store.setSetting(S.student, { name: "" }); toast("Name reset"); break;
    case "setcap": store.setSetting(b.dataset.s, { maxLevel: b.dataset.k }); break;
    case "showabove": S.showAbove = !S.showAbove; render(); break;
    case "reset": S.confirmReset = { scope: b.dataset.scope, id: b.dataset.id, student: PERSON_SCOPES.includes(b.dataset.scope) ? b.dataset.id : S.student }; render(); break;
    case "resetno": S.confirmReset = null; render(); break;
    case "resetok": if (S.confirmReset) doReset(S.confirmReset); break;
    case "fmtoggle": { const id = b.dataset.id; S.fmHide.has(id) ? S.fmHide.delete(id) : S.fmHide.add(id); store.lsSet(LS_FMHIDE, [...S.fmHide]); render(); break; }
    case "fmall": S.fmHide.clear(); store.lsSet(LS_FMHIDE, []); render(); break;
    case "fmnone": CURRICULUM.forEach(c => S.fmHide.add(c.id)); store.lsSet(LS_FMHIDE, [...S.fmHide]); render(); break;
    case "fmtop": window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "fmjump": document.getElementById("fm-" + b.dataset.id)?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "popen": S.openAttempt = S.openAttempt === b.dataset.k ? null : b.dataset.k; render(); break;
  }
});

// re-render on data changes, but never wipe a half-typed lesson answer or a running test
store.listeners.push(() => { if (S.view !== "test" && !document.activeElement?.matches?.(".numin")) render(); });
render();
store.init();
</script>
