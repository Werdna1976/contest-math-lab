<title>Contest Math Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: graph-paper ground, one centered working column (max 1440px; text uses the full width), sticky top bar with student picker. */
:root{
  --bg:#F5F7FB; --grid:#E4EAF5; --surface:#FFFFFF; --ink:#18213A; --muted:#5A6684; --line:#D5DCEA;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#E4EBFC;
  --hi:#E3AE1B; --hi-soft:#FFF4CF;
  --good:#1E8A57; --good-soft:#DDF3E7; --bad:#C2413A; --bad-soft:#FBE3E1;
  --t1:#0B7F80; --t1-soft:#D7F1F0; --t2:#B8600E; --t2-soft:#FCEAD5; --t3:#7048C8; --t3-soft:#ECE4FB;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1422; --grid:#182035; --surface:#161D2E; --ink:#E7EBF5; --muted:#9AA6C2; --line:#2A3349;
  --accent:#7C9BFF; --accent-ink:#0F1422; --accent-soft:#1F2A4A;
  --hi:#E9BC3E; --hi-soft:#3A3218;
  --t1:#4FD1C5; --t1-soft:#12302F; --t2:#F2A65A; --t2-soft:#3A2814; --t3:#B394FF; --t3-soft:#2A2148;
  --good:#4CC28A; --good-soft:#173528; --bad:#F07A72; --bad-soft:#3F1D1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1422; --grid:#182035; --surface:#161D2E; --ink:#E7EBF5; --muted:#9AA6C2; --line:#2A3349;
  --accent:#7C9BFF; --accent-ink:#0F1422; --accent-soft:#1F2A4A;
  --hi:#E9BC3E; --hi-soft:#3A3218;
  --t1:#4FD1C5; --t1-soft:#12302F; --t2:#F2A65A; --t2-soft:#3A2814; --t3:#B394FF; --t3-soft:#2A2148;
  --good:#4CC28A; --good-soft:#173528; --bad:#F07A72; --bad-soft:#3F1D1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.who-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.88rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill:disabled{opacity:.5;cursor:not-allowed}

main{max-width:1440px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}

/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero-fig{min-width:0}
.hero-fig svg{width:100%;height:auto;max-width:360px;display:block;margin-left:auto}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.door{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.door:hover{border-color:var(--accent)}
.door .k{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.door p{color:var(--muted);font-size:.92rem}

/* curriculum map */
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chap-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chap-n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.grp{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.tier{font:600 .68rem/1.2 var(--f-mono);letter-spacing:.02em;padding:2px 7px;border-radius:999px;white-space:nowrap;flex:none}
.tier.t1{background:var(--t1-soft);color:var(--t1)} .tier.t2{background:var(--t2-soft);color:var(--t2)} .tier.t3{background:var(--t3-soft);color:var(--t3)}
/* tier hover: a straight bar on the left plus a light tier-colored wash */
.lessons button,.lesson-row{position:relative}
.lessons button::before,.lesson-row::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:transparent;transition:background .12s}
.lesson-row::before{left:-1px;width:4px;top:8px;bottom:8px}
.lessons button.t1{--tc:var(--t1);--ts:var(--t1-soft)} .lessons button.t2{--tc:var(--t2);--ts:var(--t2-soft)} .lessons button.t3{--tc:var(--t3);--ts:var(--t3-soft)}
.lesson-row.t1{--tc:var(--t1);--ts:var(--t1-soft)} .lesson-row.t2{--tc:var(--t2);--ts:var(--t2-soft)} .lesson-row.t3{--tc:var(--t3);--ts:var(--t3-soft)}
.lessons button:not(:disabled):hover,.lessons button:not(:disabled):focus-visible{background:var(--ts,var(--accent-soft))}
.lessons button:not(:disabled):hover .tier,.lesson-row:not(:disabled):hover .tier{background:var(--surface)}
.lessons button:not(:disabled):hover::before,.lessons button:not(:disabled):focus-visible::before,.lesson-row:not(:disabled):hover::before,.lesson-row:not(:disabled):focus-visible::before{background:var(--tc,var(--accent))}
.lessons .lt{display:flex;align-items:center;gap:6px;min-width:0}
.tierbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tierbar button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;display:flex;gap:8px;align-items:center}
.tierbar button small{font:500 .75rem var(--f-mono);color:var(--muted)}
.tierbar button.on{border-color:var(--ink);background:var(--ink);color:var(--surface)} .tierbar button.on small{color:inherit;opacity:.8}
.tierbar button.t1.on{background:var(--t1);border-color:var(--t1)} .tierbar button.t2.on{background:var(--t2);border-color:var(--t2)} .tierbar button.t3.on{background:var(--t3);border-color:var(--t3)}
.tierbar button .tdot{width:10px;height:10px;border-radius:50%}
.tierbar button.on .tdot{background:currentColor!important}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons button{width:100%;text-align:left;background:none;border:0;padding:4px 6px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;font-size:.93rem}
.lessons button:disabled{color:var(--muted);cursor:default;opacity:.75}
.lessons .ready{color:var(--ink);font-weight:500}
.tag{font-family:var(--f-mono);font-size:.7rem;padding:1px 7px;border-radius:999px;white-space:nowrap;align-self:center}
.tag.st-soon{color:var(--muted)}
.tag.st-ready{background:var(--accent-soft);color:var(--accent)}
.tag.st-opened{background:var(--hi-soft);color:var(--ink)}
.tag.st-progress{background:var(--hi);color:#1B1A10}
.tag.st-complete{background:var(--good-soft);color:var(--good)}
.legend{gap:6px}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;flex:none;border:1.5px solid var(--muted)}
.sdot.st-ready{border-color:var(--accent)}
.sdot.st-opened{border-color:var(--hi);background:var(--hi-soft)}
.sdot.st-progress{border-color:var(--hi);background:var(--hi)}
.sdot.st-complete{border-color:var(--good);background:var(--good)}
.meter{display:flex;height:6px;border-radius:999px;background:var(--grid);overflow:hidden}
.meter span:first-child{background:var(--good)}
.meter .meter-ready{background:var(--accent-soft)}
.chap-link{background:none;border:0;padding:0;text-align:left}
.chap-link:hover h3{color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem;align-self:flex-start}
.lesson-list{display:flex;flex-direction:column;gap:6px}
.lesson-row{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.lesson-row:not(:disabled):hover,.lesson-row:not(:disabled):focus-visible{border-color:var(--tc,var(--accent));background:var(--ts,var(--surface))}
.lesson-row:disabled{cursor:default;opacity:.6}
.lesson-row small{display:block;color:var(--muted);font-size:.8rem}
.formulas{margin:0;display:flex;flex-direction:column;gap:12px}
.formulas.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px 22px}
.fm{min-width:0}
.fm dt{font-size:.82rem;color:var(--muted);font-weight:500}
.fm dd{margin:0}
.fm .eq{font-family:var(--f-mono);font-size:.95rem;overflow-x:auto}
.fm .note{font-size:.8rem;color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:.68rem;padding:0 6px;border-radius:999px;background:var(--grid);color:var(--muted);white-space:nowrap}
.side-lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side-lessons button{display:flex;align-items:center;width:100%;text-align:left;background:none;border:0;padding:3px 4px;border-radius:6px;font-size:.88rem;color:var(--muted)}
.side-lessons button:not(:disabled):hover{background:var(--accent-soft);color:var(--ink)}
.side-lessons button:disabled{cursor:default;opacity:.6}
.side-lessons li.cur button{color:var(--ink);font-weight:600}
.chap-row td{font-family:var(--f-display);font-weight:700;padding-top:14px}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;padding:0;flex:none}
.themebtn svg{width:18px;height:18px}
.sup{font-size:.75em;vertical-align:super}

/* lesson */
.crumbs{font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;align-items:start}
.prose{display:flex;flex-direction:column;gap:16px}
.prose h3{margin-top:10px}
.rule{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 16px}
.rule b{font-family:var(--f-display)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.fig figcaption{font-size:.85rem;color:var(--muted);text-align:center}
.fig svg{max-width:100%;height:auto}
.ex{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ex .lbl{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.ex details summary{cursor:pointer;color:var(--accent);font-weight:500}
.ex details[open] summary{margin-bottom:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:.92rem;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.side{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.side ol{margin:0;padding-left:20px;font-size:.92rem;color:var(--muted)}
.side li.cur{color:var(--ink);font-weight:600}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.1}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.sb{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.12em;display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap;justify-content:center}
.sb .bar{color:var(--accent);font-weight:600}
.sb .star{color:var(--hi)}
.ngrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%;max-width:420px}
.ngrid div{font-family:var(--f-mono);font-size:.85rem;text-align:center;padding:5px 0;border-radius:6px;border:1px solid var(--line)}
.ngrid .yes{background:var(--good-soft);color:var(--good);border-color:transparent}
.ngrid .no{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}

/* questions (quiz + test) */
.q{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q-n{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;display:flex;gap:6px;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.choice .L{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.numin{font:inherit;font-family:var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:160px;background:var(--surface);color:var(--ink)}
.fb{border-radius:10px;padding:10px 12px;font-size:.93rem}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.hint{background:var(--hi-soft);border-radius:10px;padding:10px 12px;font-size:.93rem}
.hint b{color:var(--ink)}

/* test runner */
.runbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.85rem;position:relative}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qnav button.cur{outline:2px solid var(--ink);outline-offset:1px}
.qnav button.h::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--hi)}
.confirm{background:var(--hi-soft);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* setup + results */
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.level{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.level[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.level .t{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.level .d{font-size:.83rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--muted)}
.attempts tr.click{cursor:pointer}
.attempts tr.click:hover td{background:var(--accent-soft)}
.miss{font-size:.88rem;color:var(--muted);padding:8px 10px 14px}
.miss li{margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}.hero-fig svg{margin:0 auto;max-width:260px}
  .doors{grid-template-columns:1fr}
  .lesson{grid-template-columns:1fr}.side{position:static}
  .levels,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .who{margin-left:0}
}
@media (max-width:520px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* level cap, formula filters, resets */
.lvl{font-family:var(--f-mono);font-size:.68rem;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;align-self:center}
.above{opacity:.55}
.jumpbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.jumpbar .row{gap:6px}
.jumpbar .lab{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:64px}
.jump{background:none;border:0;padding:2px 4px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.fm-sec{scroll-margin-top:84px}
.pill.off{opacity:.55;text-decoration:line-through}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font:inherit}
.danger{color:var(--bad);border-color:currentColor}
@media (max-width:820px){.fm-sec{scroll-margin-top:130px}}

/* formulas: one color everywhere (tile on chapter cards, panel on chapter page) */
.fm-tile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--hi-soft);border:1px solid var(--hi);border-radius:10px;padding:8px 12px;color:var(--ink)}

  { id: "geo-circles", title: "Geometry: Circles", groups: [

  { id: "geo-area", title: "Geometry: Area & Volume", groups: [

    { title: "Volume", lessons: [

      ["cubes", "Sum & difference of cubes"], ["sfft", "Simon's Favorite Factoring Trick"], ["expansions", "Clever expansions"]] } ] },

      ["conditional", "Conditional probability"], ["expected", "Expected value"], ["geo-prob", "Geometric probability"]] } ] },
];
/* Tier of each lesson: 1 beginner, 2 intermediate, 3 advanced. This is about the
   ideas in the lesson, separate from the contest level of its test problems. */
const TIERS = { 1: "Beginner", 2: "Intermediate", 3: "Advanced" };
const TIER_OF = {};
Object.entries({
  1: "order-ops fractions ratios averages mental-math units patterns backwards organized-lists polygon-angles triangle-types quadrilaterals symmetry drt clocks expressions linear-eq word-eq angle-basics parallel-lines exterior-angle primes divisibility exp-rules mult-principle circle-parts circumference circle-area basic-area prisms prob-basic",

}).forEach(([t, ids]) => ids.split(" ").forEach(id => { TIER_OF[id] = +t; }));
// normalize [id, title] pairs to objects, easier tiers first within each group
CURRICULUM.forEach(c => c.groups.forEach(g => {
  g.lessons = g.lessons.map(([id, title]) => ({ id, title, tier: TIER_OF[id] || 2 }));
  g.lessons.sort((a, b) => a.tier - b.tier);
}));

const LESSONS = {};   // filled by content/*.js
const BANK = [];      // filled by content/*.js
const FORMULAS = {};  // chapterId -> [{name, eq, note?, core?}]  core:true = also on the test-day sheet

/* =========================================================
   FIGURES
   ========================================================= */
function polyPts(n, cx, cy, r, rot = -90) {
  return Array.from({ length: n }, (_, i) => {
    const a = (rot + 360 * i / n) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
}
const P = pts => pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");

function figTriangulate(n, size = 200) {
  const c = size / 2, pts = polyPts(n, c, c + 6, c - 18);
  let tris = "";
  for (let i = 1; i < n - 1; i++) {
    const fill = i % 2 ? "var(--accent-soft)" : "var(--hi-soft)";
    tris += `<polygon points="${P([pts[0], pts[i], pts[i + 1]])}" fill="${fill}" stroke="var(--ink)" stroke-width="1.5"/>`;
    const cx = (pts[0][0] + pts[i][0] + pts[i + 1][0]) / 3, cy = (pts[0][1] + pts[i][1] + pts[i + 1][1]) / 3;
    tris += `<text x="${cx.toFixed(1)}" y="${(cy + 5).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="13" fill="var(--ink)">${i}</text>`;
  }
  return `<svg viewBox="0 0 ${size} ${size + 10}" width="${size}" role="img" aria-label="${n}-gon split into ${n - 2} triangles">${tris}<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="5" fill="var(--accent)"/></svg>`;
}

function figDiagonals(n, from = null, size = 200) {
  const c = size / 2, pts = polyPts(n, c, c, c - 14);
  let lines = "";
  for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) {
    if (i === 0 && j === n - 1) continue;
    const hot = from !== null && (i === from || j === from);
    lines += `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}" stroke="${hot ? "var(--accent)" : "var(--muted)"}" stroke-width="${hot ? 2.5 : 1}" ${hot ? "" : 'stroke-dasharray="4 3"'}/>`;
  }
  const dots = pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === from ? 6 : 4}" fill="${i === from ? "var(--accent)" : "var(--ink)"}"/>`).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" role="img" aria-label="${n}-gon with its diagonals"><polygon points="${P(pts)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>${lines}${dots}</svg>`;
}

function figExterior() {
  // pentagon with extended sides showing exterior angles
  const pts = polyPts(5, 130, 120, 70, -90);
  let ext = "";
  for (let i = 0; i < 5; i++) {
    const a = pts[i], b = pts[(i + 1) % 5];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const e = [b[0] + dx / L * 38, b[1] + dy / L * 38];
    ext += `<line x1="${b[0].toFixed(1)}" y1="${b[1].toFixed(1)}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>`;
    ext += `<text x="${(e[0] + 4).toFixed(1)}" y="${(e[1] + 4).toFixed(1)}" font-family="var(--f-mono)" font-size="12" fill="var(--accent)">72°</text>`;
  }
  return `<svg viewBox="0 0 270 250" width="270" role="img" aria-label="Regular pentagon with each side extended to show 72 degree exterior angles"><polygon points="${P(pts)}" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2"/>${ext}<text x="130" y="126" text-anchor="middle" font-family="var(--f-mono)" font-size="12" fill="var(--ink)">5 × 72° = 360°</text></svg>`;
}

function figStarsBars(groups, labels) {
  const parts = groups.map(g => `<span class="star">${"★".repeat(g)}</span>`);
  const row = parts.join('<span class="bar">|</span>');
  const lab = labels ? `<div class="row" style="justify-content:center;gap:22px;font-size:.85rem;color:var(--muted)">${labels.map((l, i) => `<span>${l}: <b class="mono" style="color:var(--ink)">${groups[i]}</b></span>`).join("")}</div>` : "";
  return `<div class="sb" aria-label="stars and bars diagram">${row}</div>${lab}`;
}

function figMcNugget(a, b, upto = 30) {
  const ok = new Array(upto + 1).fill(false); ok[0] = true;
  for (let n = 1; n <= upto; n++) ok[n] = (n >= a && ok[n - a]) || (n >= b && ok[n - b]);
  let cells = "";
  for (let n = 1; n <= upto; n++) cells += `<div class="${ok[n] ? "yes" : "no"}">${n}</div>`;
  return `<div class="ngrid" role="img" aria-label="Numbers 1 to ${upto}; unreachable with ${a} and ${b} shown in red">${cells}</div>`;
}

const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;


/* =========================================================
   AUTHORING HELPERS (used by content/*.js)
   ========================================================= */
const ex = (q, sol, tag = "") => `<div class="ex"><span class="lbl">Example${tag ? " · " + tag : ""}</span><p>${q}</p><details><summary>Show solution</summary><p>${sol}</p></details></div>`;
const rule = (title, html) => `<div class="rule"><b>${title}</b> ${html}</div>`;
const aops = (page, label) => `<p class="lede">Reference: <a href="https://artofproblemsolving.com/wiki/index.php/${page}" target="_blank" rel="noopener">AoPS Wiki: ${label}</a></p>`;
const tbl = (head, rows) => `<div class="tbl-wrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const fig = (svg, cap) => `<figure class="fig">${svg}${cap ? `<figcaption>${cap}</figcaption>` : ""}</figure>`;
const svg = (w, h, inner, label = "") => `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${label}" font-family="var(--f-mono)" font-size="13">${inner}</svg>`;
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" fill="${o.fill || "var(--ink)"}" text-anchor="${o.a || "middle"}" font-size="${o.size || 13}">${s}</text>`;
const seg = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c || "var(--ink)"}" stroke-width="${o.w || 2}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ""}/>`;
const poly = (pts, o = {}) => `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="${o.fill || "var(--accent-soft)"}" stroke="${o.c || "var(--ink)"}" stroke-width="${o.w || 2}"/>`;
const circ = (cx, cy, r, o = {}) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${o.fill || "none"}" stroke="${o.c || "var(--ink)"}" stroke-width="${o.w || 2}"/>`;
const dot = (x, y, o = {}) => `<circle cx="${x}" cy="${y}" r="${o.r || 4}" fill="${o.c || "var(--ink)"}"/>`;
const pathEl = (d, o = {}) => `<path d="${d}" fill="${o.fill || "none"}" stroke="${o.c || "var(--ink)"}" stroke-width="${o.w || 2}"/>`;
const rightMark = (x, y, dx, dy, s = 12) => pathEl(`M${x + dx * s} ${y} L${x + dx * s} ${y + dy * s} L${x} ${y + dy * s}`, { w: 1.5 });
function gridFig(w, h, cell, inner, label) {
  let g = "";
  for (let x = 0; x <= w; x += cell) g += seg(x, 0, x, h, { c: "var(--line)", w: 1 });
  for (let y = 0; y <= h; y += cell) g += seg(0, y, w, y, { c: "var(--line)", w: 1 });
  return svg(w, h, g + inner, label);
}
const sup = s => `<sup>${s}</sup>`;
const sqrt = s => `√<span style="text-decoration:overline">${s}</span>`;

/* quiz + bank item builders */
const num = (q, answer, explain, unit) => ({ q, type: "num", answer, explain, unit });
const mc = (q, choices, answer, explain) => ({ q, type: "mc", choices, answer, explain });
const B = (id, level, topic, q, choices, answer, hint, solution, figFn) => ({ id, level, topic, q, choices, answer, hint, solution, fig: figFn });

/* =========================================================
   PROBLEM GENERATORS
   Each generator makes a fresh problem with new numbers every time it runs.
   The answer is computed, never typed, so it can't be wrong; validate.js also
   brute-forces many of them through their optional check().

   GEN(id, topic, level, fn, check?)
     fn(R) returns { q, a, traps, hint, sol, fmt?, min?, step?, fig? }
       a      the answer: a number (choices are built around it) or a string
       traps  plausible wrong answers (common mistakes); strings need at least 4
       fmt    number → display string (default: plain, with thousands commas)
       min    smallest allowed choice value (default 0 when a ≥ 0)
     max    largest allowed choice value (default none), e.g. 9 for a units digit
       step   spacing for filler choices (default picked from the answer's size)
     check(p) recomputes the answer by brute force from fn's params (R.p)
   ========================================================= */
const GENS = [];
const GEN = (id, topic, level, fn, check) => GENS.push({ id, topic, level, fn, check });

/* random helpers handed to generators */
function makeR() {
  const R = {
    p: {},
    int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
    pick: arr => arr[Math.floor(Math.random() * arr.length)],
    shuffle: arr => shuffleArr(arr),
    distinct: (n, a, b) => { const s = new Set(); while (s.size < n) s.add(R.int(a, b)); return [...s]; },
  };
  return R;
}
function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* number theory + counting helpers */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
const fact = n => n <= 1 ? 1 : n * fact(n - 1);
const nCr = (n, r) => { if (r < 0 || r > n) return 0; r = Math.min(r, n - r); let x = 1; for (let i = 1; i <= r; i++) x = x * (n - r + i) / i; return Math.round(x); };
const nPr = (n, r) => r > n ? 0 : fact(n) / fact(n - r);
const isPrime = n => { if (n < 2) return false; for (let d = 2; d * d <= n; d++) if (n % d === 0) return false; return true; };
const divisors = n => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };
const fr = (num, den) => { if (den < 0) { num = -num; den = -den; } const g = gcd(num, den) || 1; num /= g; den /= g; return den === 1 ? String(num) : `${num}/${den}`; };
const commas = n => (Number.isInteger(n) && Math.abs(n) >= 10000 ? n.toLocaleString("en-US") : String(n)).replace(/^-/, "−");
/* "a" or "an" before a number written in digits: an 8, an 11, an 18, an 80 */
const aN = n => /^(8|11$|18$|11\d\d$|18\d\d$)/.test(String(n)) ? "An" : "A";

/* Build 5 choices with the answer at a uniformly random position.
   Numbers: choices are sorted (contest style), so the position is set by how many
   wrong answers sit below the right one. */
function buildChoices(out) {
  const fmt = out.fmt || commas;
  if (typeof out.a === "number") {
    const a = out.a, min = out.min ?? (a >= 0 ? 0 : -Infinity);
    // a cap that leaves fewer than 4 wrong answers is dropped (e.g. remainders mod 3)
    const max = out.max !== undefined && out.max - min >= 4 ? out.max : Infinity;
    const step = out.step || (Math.abs(a) < 20 ? 1 : Math.abs(a) < 200 ? Math.max(2, Math.round(Math.abs(a) / 20)) : Math.round(Math.abs(a) / 12));
    const traps = [...new Set((out.traps || []).filter(x => typeof x === "number" && isFinite(x) && x !== a && x >= min && x <= max))];
    const lowT = shuffleArr(traps.filter(x => x < a)), highT = shuffleArr(traps.filter(x => x > a));
    const fill = (dir, need, have) => { for (let k = 1; have.length < need && k < 60; k++) { const v = a + dir * k * step; if (v >= min && v <= max && v !== a && !have.includes(v)) have.push(v); } return have; };
    let t = Math.floor(Math.random() * 5);
    // how many values below and above a are even possible?
    const room = Math.max(lowT.length, Math.floor((a - min) / step - 1e-9)), roomUp = Math.max(highT.length, Math.floor((max - a) / step + 1e-9));
    t = Math.max(Math.min(t, room), 4 - roomUp);
    const low = fill(-1, t, lowT.slice(0, t)), high = fill(1, 4 - t, highT.slice(0, 4 - t));
    const vals = [...low.slice(0, t), a, ...high.slice(0, 4 - t)].sort((x, y) => x - y);
    return { choices: vals.map(fmt), answer: vals.indexOf(a) };
  }
  const opts = shuffleArr([out.a, ...[...new Set(out.traps.filter(x => x !== out.a))].slice(0, 4)]);
  return { choices: opts, answer: opts.indexOf(out.a) };
}

/* Make one test question from a generator */
function genProblem(g) {
  const R = makeR(), out = g.fn(R);
  const { choices, answer } = buildChoices(out);
  return { id: `gen:${g.id}`, level: g.level, topic: g.topic, q: out.q, choices, answer, hint: out.hint, solution: out.sol, fig: out.fig, gen: g.id, params: R.p };
}

/* brute-force helpers (used by fn when counting is cheap, and by check) */
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
function permsOf(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  arr.forEach((x, i) => { for (const p of permsOf([...arr.slice(0, i), ...arr.slice(i + 1)])) out.push([x, ...p]); });
  return out;
}
const uniquePerms = arr => [...new Set(permsOf(arr).map(p => p.join("\u0001")))].map(s => s.split("\u0001"));
const digitsOf = n => String(n).split("").map(Number);
const countIf = (a, b, f) => { let c = 0; for (let i = a; i <= b; i++) if (f(i)) c++; return c; };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");

    body: () => `
      <p>Every polygon can be chopped into triangles, and every triangle's angles add to 180°. That one fact gives you the angle sum of <i>any</i> polygon.</p>
      <h3>Why (n − 2) × 180°</h3>
      <p>Pick one corner. Draw a line from it to every corner it isn't already connected to. A polygon with <i>n</i> sides always splits into <b>n − 2</b> triangles this way.</p>
      <figure class="fig">${figTriangulate(5)}<figcaption>A pentagon (5 sides) splits into 3 triangles: 3 × 180° = 540°.</figcaption></figure>
      <div class="rule"><b>Interior angle sum</b> of an n-sided polygon = (n − 2) × 180°</div>
      <div class="tbl-wrap"><table><thead><tr><th>Sides</th><th>Name</th><th>Triangles</th><th>Angle sum</th></tr></thead><tbody>
        ${[[3,"Triangle"],[4,"Quadrilateral"],[5,"Pentagon"],[6,"Hexagon"],[7,"Heptagon"],[8,"Octagon"],[9,"Nonagon"],[10,"Decagon"],[12,"Dodecagon"]].map(([n,nm])=>`<tr><td class="mono">${n}</td><td>${nm}</td><td class="mono">${n-2}</td><td class="mono">${(n-2)*180}°</td></tr>`).join("")}
      </tbody></table></div>
      <p>Notice the sums go up by 180° each time you add a side. You don't need to memorize the table, just the pattern.</p>

      <h3>One angle of a regular polygon</h3>
      <p>A <b>regular</b> polygon has all sides equal and all angles equal, so you just divide the sum by n.</p>
      <div class="rule"><b>Each interior angle</b> of a regular n-gon = ${frac("(n − 2) × 180°", "n")}</div>
      <div class="ex"><span class="lbl">Example 1</span><p>What is each angle of a stop sign (a regular octagon)?</p>
        <details><summary>Show solution</summary><p>Sum = 6 × 180° = 1080°. Each angle = 1080° ÷ 8 = <b>135°</b>.</p></details></div>

      <h3>Exterior angles add to 360°</h3>
      <p>Extend each side as you walk around the polygon. At each corner you turn by the <b>exterior angle</b>. After one full lap you've turned exactly once around: 360°. This works for <i>every</i> convex polygon, no matter how many sides.</p>
      <figure class="fig">${figExterior()}<figcaption>Walk around a regular pentagon: you turn 72° five times.</figcaption></figure>
      <div class="rule"><b>Exterior angles</b> of any convex polygon add to 360°.<br>For a regular n-gon, each exterior angle = 360° ÷ n, and <b>interior + exterior = 180°</b>.</div>
      <p>This is usually the fastest route. For a regular dodecagon (12 sides): exterior = 360 ÷ 12 = 30°, so interior = 180 − 30 = 150°. No big multiplication needed.</p>

      <h3>Working backwards</h3>
      <p>Contest problems love to give you the angle and ask for the number of sides. Go through the exterior angle.</p>
      <div class="ex"><span class="lbl">Example 2</span><p>Each interior angle of a regular polygon is 140°. How many sides does it have?</p>
        <details><summary>Show solution</summary><p>Exterior angle = 180° − 140° = 40°. Sides = 360 ÷ 40 = <b>9</b>.</p></details></div>
      <div class="ex"><span class="lbl">Example 3</span><p>A pentagon has angles 100°, 110°, 120°, x°, and x°. Find x.</p>
        <details><summary>Show solution</summary><p>Pentagon sum = 540°. So 330 + 2x = 540, which gives 2x = 210 and <b>x = 105</b>.</p></details></div>
      <div class="ex"><span class="lbl">Example 4 · contest style</span><p>Can a regular polygon have interior angles of 130°?</p>
        <details><summary>Show solution</summary><p>Exterior would be 50°, and 360 ÷ 50 = 7.2. That's not a whole number of sides, so <b>no</b>. A regular polygon exists only when 360 ÷ (exterior angle) is a whole number of at least 3.</p></details></div>
      <p class="lede">Reference: <a href="https://artofproblemsolving.com/wiki/index.php/Polygon" target="_blank" rel="noopener">AoPS Wiki: Polygon</a></p>`,

      <p>A <b>diagonal</b> is a segment joining two corners (vertices) that are <i>not</i> next to each other. Sides don't count.</p>
      <h3>Counting from one corner</h3>
      <p>Stand at one corner of an n-gon. You can't draw a diagonal to yourself or to your two neighbors (those are sides). That leaves <b>n − 3</b> corners to connect to.</p>
      <figure class="fig">${figDiagonals(6, 0)}<figcaption>From one corner of a hexagon: 6 − 3 = 3 diagonals (solid). All 9 diagonals are dashed.</figcaption></figure>
      <h3>The formula</h3>
      <p>Each of the n corners has n − 3 diagonals, giving n(n − 3). But that counts every diagonal twice, once from each end. So divide by 2.</p>
      <div class="rule"><b>Number of diagonals</b> of an n-gon = ${frac("n(n − 3)", "2")}</div>
      <p>Another way to see it: choose any 2 of the n corners, which is ${frac("n(n − 1)", "2")} pairs, then subtract the n pairs that are sides.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Sides n</th><th>From one corner</th><th>Total diagonals</th></tr></thead><tbody>

      </tbody></table></div>
      <div class="ex"><span class="lbl">Example 1</span><p>How many diagonals does a decagon have?</p>
        <details><summary>Show solution</summary><p>10 × 7 ÷ 2 = <b>35</b>.</p></details></div>
      <h3>Working backwards</h3>
      <p>If you know the number of diagonals D, then n(n − 3) = 2D. Look for two numbers that differ by 3 and multiply to 2D.</p>
      <div class="ex"><span class="lbl">Example 2</span><p>A convex polygon has 27 diagonals. How many sides?</p>
        <details><summary>Show solution</summary><p>n(n − 3) = 54. Try numbers 3 apart: 9 × 6 = 54. So <b>n = 9</b>.</p></details></div>
      <div class="ex"><span class="lbl">Example 3 · contest style</span><p>Which polygon has exactly as many diagonals as sides?</p>
        <details><summary>Show solution</summary><p>n(n − 3)/2 = n. Divide by n: (n − 3)/2 = 1, so n = 5. The <b>pentagon</b>: 5 sides, 5 diagonals (the star inside it).</p></details></div>

    body: () => `
      <p>Stars and bars counts the ways to split <b>identical</b> things among <b>different</b> people or boxes. "Identical" matters: the cookies are all the same, but the kids are not.</p>
      <h3>The picture</h3>
      <p>Give 5 identical cookies to 3 kids: Ava, Ben, Cal. Draw the cookies as stars and use 2 bars to split them into 3 groups.</p>
      <figure class="fig">${figStarsBars([2,1,2],["Ava","Ben","Cal"])}<figcaption>★★ | ★ | ★★ means Ava 2, Ben 1, Cal 2.</figcaption></figure>
      <figure class="fig">${figStarsBars([0,4,1],["Ava","Ben","Cal"])}<figcaption>| ★★★★ | ★ means Ava gets nothing, Ben 4, Cal 1.</figcaption></figure>
      <p>Every arrangement of 5 stars and 2 bars in a row gives exactly one way to share the cookies, and every way of sharing gives exactly one arrangement. So we count arrangements: 7 spots, choose which 2 are bars.</p>
      <p class="mono" style="text-align:center">C(7, 2) = 21 ways</p>

      <h3>Boxes may be empty</h3>
      <p>For n identical items into k boxes, you need k − 1 bars. Total spots: n + k − 1.</p>
      <div class="rule"><b>Empty boxes allowed:</b> C(n + k − 1, k − 1) ways.<br>Same as the number of solutions to x<sub>1</sub> + x<sub>2</sub> + … + x<sub>k</sub> = n with each x ≥ 0.</div>
      <div class="ex"><span class="lbl">Example 1</span><p>10 identical candies go to 4 kids. Some kids may get none. How many ways?</p>
        <details><summary>Show solution</summary><p>n = 10, k = 4: C(13, 3) = 13 × 12 × 11 ÷ 6 = <b>286</b>.</p></details></div>
      <div class="ex"><span class="lbl">Example 2</span><p>A donut shop has 4 kinds of donuts. How many different boxes of 6 donuts can you buy?</p>
        <details><summary>Show solution</summary><p>The 6 donut slots are the stars, the 4 kinds are the boxes. C(9, 3) = <b>84</b>.</p></details></div>

      <h3>Every box gets at least one</h3>
      <p>Hand out 1 to each box first. Now n − k items are left to share with no restrictions. Or picture it directly: line up the n stars and put bars only in the n − 1 gaps <i>between</i> stars, at most one bar per gap.</p>
      <div class="rule"><b>No empty boxes:</b> C(n − 1, k − 1) ways.<br>Same as positive-integer solutions to x<sub>1</sub> + … + x<sub>k</sub> = n.</div>
      <div class="ex"><span class="lbl">Example 3</span><p>How many ordered triples of positive integers (a, b, c) have a + b + c = 12?</p>

      <p class="lede">Reference: <a href="https://artofproblemsolving.com/wiki/index.php/Ball-and-urn" target="_blank" rel="noopener">AoPS Wiki: Ball-and-urn (stars and bars)</a></p>`,

    body: () => `
      <p>Suppose nuggets come only in boxes of 3 and 5. Which numbers of nuggets can you buy exactly? Which can't you?</p>
      <h3>The question</h3>
      <p>We want totals of the form 3x + 5y with x, y whole numbers (0 allowed). Green numbers below are reachable, red ones are not.</p>
      <figure class="fig">${figMcNugget(3,5,30)}<figcaption>With boxes of 3 and 5, only 1, 2, 4, 7 are impossible. After 7, every number works.</figcaption></figure>
      <p>Why does it stop at 7? Once you have <b>3 reachable numbers in a row</b> (8, 9, 10), add 3s forever to get every number after. In general, once you have a run as long as the smaller box size, you're done.</p>

      <h3>The theorem</h3>
      <div class="rule"><b>Chicken McNugget theorem.</b> If a and b are positive integers with no common factor (gcd = 1), the largest number that <i>cannot</i> be written as ax + by with x, y ≥ 0 is<br><span class="mono">ab − a − b</span></div>
      <p>Check: 3 × 5 − 3 − 5 = 7. ✓</p>
      <div class="ex"><span class="lbl">Example 1</span><p>You have only 5¢ and 8¢ stamps. What is the largest postage you cannot make?</p>
        <details><summary>Show solution</summary><p>gcd(5, 8) = 1, so the answer is 40 − 5 − 8 = <b>27¢</b>.</p></details></div>

      <h3>Counting the gaps</h3>
      <p>Exactly half the numbers from 1 to ab − a − b are unreachable. That gives a second formula.</p>
      <div class="rule"><b>How many</b> positive integers can't be made: ${frac("(a − 1)(b − 1)", "2")}</div>
      <p>Check with 3 and 5: 2 × 4 ÷ 2 = 4, and the list is 1, 2, 4, 7. ✓</p>
      <div class="ex"><span class="lbl">Example 2</span><p>Basketball-style scoring where plays are worth 4 or 7 points. How many positive scores are impossible?</p>
        <details><summary>Show solution</summary><p>(4 − 1)(7 − 1) ÷ 2 = 3 × 6 ÷ 2 = <b>9</b>. The largest is 28 − 11 = 17.</p></details></div>

      <h3>When it fails</h3>
      <p>If a and b share a factor, say 6 and 9 (both multiples of 3), then every total is a multiple of 3. There are infinitely many impossible numbers, and no largest one. Always check the gcd first.</p>
      <p><b>Fun fact:</b> McDonald's once sold nuggets in boxes of 6, 9, and 20. With three box sizes there's no simple formula, but you can check by hand that 43 is the largest impossible order.</p>
      <p class="lede">Reference: <a href="https://artofproblemsolving.com/wiki/index.php/Chicken_McNugget_Theorem" target="_blank" rel="noopener">AoPS Wiki: Chicken McNugget Theorem</a></p>`,

      { q: "For which pair of box sizes are there <b>infinitely many</b> impossible totals?", type: "mc", choices: ["5 and 7", "4 and 9", "6 and 9", "3 and 10", "7 and 11"], answer: 2, explain: "6 and 9 share the factor 3, so only multiples of 3 are possible." },

    ],
  },

  { id: "a8-3", level: "amc8", topic: "stars-bars", q: "How many ordered triples (a, b, c) of nonnegative <b>even</b> integers satisfy a + b + c = 14?", choices: ["28", "36", "45", "56", "120"], answer: 1, hint: "Write a = 2a′, b = 2b′, c = 2c′. What do a′, b′, c′ add up to?", solution: "a′ + b′ + c′ = 7 with each ≥ 0: C(9, 2) = 36." },
  { id: "a8-4", level: "amc8", topic: "mcnugget", q: "A store sells stickers only in packs of 7 and packs of 10. How many positive whole numbers of stickers is it impossible to buy exactly?", choices: ["18", "24", "27", "30", "53"], answer: 2, hint: "Count of impossible totals = (a − 1)(b − 1) ÷ 2.", solution: "(6 × 9) ÷ 2 = 27. (53 is the largest impossible total, not the count.)" },
  { id: "a8-5", level: "amc8", topic: "polygon-angles", q: "The six interior angles of a convex hexagon form an arithmetic sequence with common difference 10°. What is the largest angle?", choices: ["135°", "140°", "145°", "150°", "155°"], answer: 2, hint: "The angles average 720° ÷ 6. The middle of the sequence sits between the 3rd and 4th terms.", solution: "Angles a, a+10, …, a+50 sum to 6a + 150 = 720, so a = 95. Largest = 145°." },
  { id: "a8-6", level: "amc8", topic: "stars-bars", q: "In how many ways can 10 identical balls be placed into 4 different boxes so that no box is empty?", choices: ["56", "84", "120", "210", "286"], answer: 1, hint: "Put one ball in each box first. Or: bars go in gaps between balls.", solution: "C(10 − 1, 3) = C(9, 3) = 84." },
  { id: "a8-7", level: "amc8", topic: "mcnugget", q: "Using only 5-cent and 6-cent stamps, what is the largest postage (in cents) that cannot be made exactly?", choices: ["14", "19", "23", "24", "29"], answer: 1, hint: "gcd(5, 6) = 1, so the McNugget formula applies.", solution: "30 − 5 − 6 = 19." },

  // ---- AMC 10 ----
  { id: "a10-1", level: "amc10", topic: "diagonals", q: "A convex polygon has 5 times as many diagonals as it has sides. How many sides does it have?", choices: ["10", "11", "12", "13", "14"], answer: 3, hint: "Set n(n − 3)/2 = 5n and divide by n.", solution: "(n − 3)/2 = 5 → n = 13." },
  { id: "a10-2", level: "amc10", topic: "polygon-angles", q: "For how many values of n ≥ 3 does a regular n-gon have interior angles that are a whole number of degrees?", choices: ["20", "21", "22", "23", "24"], answer: 2, hint: "Interior is a whole number exactly when the exterior angle 360/n is. So n must divide 360.", solution: "360 = 2³·3²·5 has 4·3·2 = 24 divisors. Remove n = 1 and n = 2: 22." },
  { id: "a10-3", level: "amc10", topic: "stars-bars", q: "How many ordered triples of nonnegative integers (a, b, c) satisfy a + b + c = 10 and a ≤ 5?", choices: ["45", "51", "55", "60", "66"], answer: 1, hint: "Count all solutions, then subtract the ones with a ≥ 6.", solution: "All: C(12, 2) = 66. With a ≥ 6: a′ + b + c = 4 → C(6, 2) = 15. Answer 66 − 15 = 51." },
  { id: "a10-4", level: "amc10", topic: "stars-bars", q: "In how many ways can 8 identical candies be given to 3 children so that no child gets more than 4?", choices: ["10", "12", "15", "18", "21"], answer: 2, hint: "Complementary counting: subtract the cases where some child gets 5 or more. Can two children both get 5+?", solution: "All: C(10, 2) = 45. One child ≥ 5: 3 × C(5, 2) = 30. Two children can't both have 5+. 45 − 30 = 15." },
  { id: "a10-5", level: "amc10", topic: "mcnugget", q: "In a game, plays score 3 or 7 points. What is the sum of all positive scores that are impossible to reach?", choices: ["25", "28", "31", "36", "44"], answer: 2, hint: "There are only (2·6)/2 = 6 impossible scores, all at most 21 − 10 = 11. List them.", solution: "Impossible: 1, 2, 4, 5, 8, 11. Sum = 31." },
  { id: "a10-6", level: "amc10", topic: "mcnugget", q: "How many pairs of integers (a, b) with 1 < a < b and gcd(a, b) = 1 have 23 as the largest number not expressible as ax + by with x, y ≥ 0?", choices: ["2", "3", "4", "5", "6"], answer: 2, hint: "ab − a − b = 23 can be rewritten as (a − 1)(b − 1) = 24.", solution: "(a − 1, b − 1) ∈ {(1,24), (2,12), (3,8), (4,6)} → (2,25), (3,13), (4,9), (5,7). All coprime: 4 pairs." },
  { id: "a10-7", level: "amc10", topic: "diagonals", q: "How many triangles have all three vertices at vertices of a regular decagon, but share no side with the decagon?", choices: ["40", "50", "60", "70", "80"], answer: 1, hint: "Start with C(10, 3) triangles. Subtract those using exactly one decagon side and those using two.", solution: "Total 120. Two sides (three consecutive vertices): 10. Exactly one side: 10 sides × 6 non-adjacent third vertices = 60. 120 − 10 − 60 = 50." },

    ${seg(110, 100, 110, 128, { w: 1.5, c: "var(--muted)" })}

function figSimilar() {
  return svg(360, 150, `
    ${poly([[20, 130], [100, 130], [20, 70]])}${txt(60, 145, "4")}${txt(10, 104, "3")}${txt(68, 96, "5")}

}
function figCoordinate() {
  // grid 0..8 by 0..10, points (1,2) and (7,10)
  const X = x => 20 + x * 24, Y = y => 260 - y * 24;
  let g = "";
  for (let x = 0; x <= 8; x++) g += seg(X(x), Y(0), X(x), Y(10), { c: "var(--line)", w: 1 });
  for (let y = 0; y <= 10; y++) g += seg(X(0), Y(y), X(8), Y(y), { c: "var(--line)", w: 1 });
  return svg(240, 275, g + seg(X(0), Y(0), X(8), Y(0), { w: 1.5 }) + seg(X(0), Y(0), X(0), Y(10), { w: 1.5 }) +
    seg(X(1), Y(2), X(7), Y(2), { c: "var(--hi)", w: 2.5 }) + seg(X(7), Y(2), X(7), Y(10), { c: "var(--hi)", w: 2.5 }) +
    seg(X(1), Y(2), X(7), Y(10), { c: "var(--accent)", w: 3 }) + dot(X(1), Y(2), { c: "var(--accent)", r: 5 }) + dot(X(7), Y(10), { c: "var(--accent)", r: 5 }) +
    txt(X(4), Y(2) + 16, "6") + txt(X(7) + 12, Y(6), "8") + txt(X(3.2), Y(6.6), "10", { fill: "var(--accent)" }) +
    txt(X(1), Y(2) + 18, "(1, 2)", { size: 11 }) + txt(X(7) - 20, Y(10) - 6, "(7, 10)", { size: 11 }), "Distance from (1,2) to (7,10) is the hypotenuse of a 6-8-10 right triangle");
}
function figCube() {
  return svg(200, 170, `

    ${poly([[20, 60], [60, 20], [160, 20], [120, 60]], { fill: "var(--hi-soft)" })}

}

FORMULAS["counting"] = [
  { name: "Multiplication principle", eq: "a ways, then b ways → a × b ways", core: true },
  { name: "Arrange n different things", eq: "n! = n × (n − 1) × … × 1", note: "0! = 1" },
  { name: "Permutations (order matters)", eq: "P(n, k) = n! ÷ (n − k)!", core: true },
  { name: "Combinations (order doesn't)", eq: "C(n, k) = n! ÷ (k! (n − k)!)", note: "C(n, k) = C(n, n − k)", core: true },
  { name: "Handshakes / pairs from n", eq: "C(n, 2) = n(n − 1) ÷ 2" },
  { name: "Arrangements with repeated letters", eq: "n! ÷ (a! b! c! …)", core: true },
  { name: "Complementary counting", eq: "wanted = total − unwanted", core: true },
  { name: "Pascal's rule", eq: "C(n, k) = C(n − 1, k − 1) + C(n − 1, k)" },
  { name: "Binomial theorem", eq: "(x + y)ⁿ = Σ C(n, k) xⁿ⁻ᵏ yᵏ", note: "Row n of Pascal's triangle gives the coefficients; they add to 2ⁿ" },
  { name: "Subsets of an n-element set", eq: "2ⁿ" },
  { name: "Grid paths (a right, b up)", eq: "C(a + b, a)", core: true },
  { name: "Inclusion–exclusion (2 sets)", eq: "|A ∪ B| = |A| + |B| − |A ∩ B|", core: true },
  { name: "Inclusion–exclusion (3 sets)", eq: "|A|+|B|+|C| − |A∩B| − |A∩C| − |B∩C| + |A∩B∩C|" },
  { name: "Stars and bars (n identical into k boxes)", eq: "C(n + k − 1, k − 1)  · no empty box: C(n − 1, k − 1)", core: true },
  { name: "Chicken McNugget (gcd(a, b) = 1)", eq: "largest impossible = ab − a − b · count = (a − 1)(b − 1) ÷ 2", core: true },
  { name: "Pigeonhole", eq: "N items in k boxes → some box has at least ⌈N ÷ k⌉" },
  { name: "Circular arrangements", eq: "(n − 1)!  · flips also equal: (n − 1)! ÷ 2" },
  { name: "Derangements (nobody in own spot)", eq: "D(n) = (n − 1)(D(n − 1) + D(n − 2))", note: "1, 0, 1, 2, 9, 44, 265 for n = 0…6" },
];

function figGridPath() {
  const X = i => 30 + i * 50, Y = j => 170 - j * 50;
  let g = "";
  for (let i = 0; i <= 4; i++) g += seg(X(i), Y(0), X(i), Y(3), { c: "var(--line)", w: 1.5 });
  for (let j = 0; j <= 3; j++) g += seg(X(0), Y(j), X(4), Y(j), { c: "var(--line)", w: 1.5 });
  const path = [[0, 0], [1, 0], [1, 1], [2, 1], [3, 1], [3, 2], [4, 2], [4, 3]];
  g += pathEl("M" + path.map(([i, j]) => `${X(i)} ${Y(j)}`).join(" L"), { c: "var(--accent)", w: 4 });
  g += dot(X(0), Y(0), { r: 6, c: "var(--accent)" }) + dot(X(4), Y(3), { r: 6, c: "var(--accent)" }) + txt(X(0) - 4, Y(0) + 20, "A") + txt(X(4) + 4, Y(3) - 10, "B");
  return svg(260, 200, g, "A path on a 4 by 3 grid moving only right and up");
}
function figPascal(rows = 7) {
  let s = "", w = 360;
  for (let n = 0; n < rows; n++) {
    let c = 1;
    for (let k = 0; k <= n; k++) {
      const x = w / 2 + (k - n / 2) * 44, y = 22 + n * 28;
      s += txt(x, y, c, { fill: n === 4 ? "var(--accent)" : "var(--ink)" });
      c = c * (n - k) / (k + 1);
    }
  }
  return svg(w, rows * 28 + 6, s, "Pascal's triangle, rows 0 through 6");
}
function figVenn() {
  return svg(300, 170, `
    <circle cx="115" cy="85" r="65" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" fill-opacity=".8"/>
    <circle cx="185" cy="85" r="65" fill="var(--hi-soft)" stroke="var(--hi)" stroke-width="2" fill-opacity=".8"/>
    ${txt(85, 90, "A only")}${txt(150, 90, "both")}${txt(215, 90, "B only")}${txt(115, 14, "A", { size: 15 })}${txt(185, 14, "B", { size: 15 })}`, "Venn diagram of two overlapping sets");
}
function figRoundTable(n = 5) {
  const pts = polyPts(n, 100, 100, 70);
  let s = circ(100, 100, 48, { fill: "var(--hi-soft)", c: "var(--line)" });
  pts.forEach((p, i) => { s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="15" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>` + txt(p[0].toFixed(1), (p[1] + 5).toFixed(1), "ABCDEFGH"[i]); });
  return svg(200, 200, s, `${n} people around a round table`);
}

  "pascal": {
    title: "Pascal's triangle & binomial theorem", minutes: 14,
    outline: ["Building the triangle", "Entries are combinations", "Expanding (x + y)ⁿ", "Row sums", "Check yourself"],
    body: () => `
      <h3>Building the triangle</h3>
      <p>Start with 1. Each number is the sum of the two above it.</p>
      ${fig(figPascal(), "Rows 0 to 6. Row 4 (blue) is 1 4 6 4 1.")}
      <h3>Entries are combinations</h3>
      <p>Entry k of row n (counting from 0) is C(n, k). Adding the two above is <b>Pascal's rule</b>: C(n, k) = C(n − 1, k − 1) + C(n − 1, k).</p>
      <h3>Expanding (x + y)ⁿ</h3>
      ${rule("Binomial theorem:", "the coefficients of (x + y)ⁿ are row n of Pascal's triangle: the term with xⁿ⁻ᵏ yᵏ has coefficient C(n, k).")}
      ${ex("Expand (x + 1)⁴.", "Row 4: 1 4 6 4 1, so <b>x⁴ + 4x³ + 6x² + 4x + 1</b>.")}
      ${ex("Find the coefficient of x²y³ in (x + y)⁵.", "C(5, 3) = <b>10</b>.")}
      ${ex("Find the coefficient of x² in (2x + 1)⁴.", "The term is C(4, 2)(2x)²(1)² = 6 × 4x² = <b>24</b>x². Don't forget to raise the 2 to the power too.", "trap")}
      <h3>Row sums</h3>
      <p>Row n adds to 2ⁿ. That's also the number of subsets of an n-element set, since each subset chooses some number k of elements.</p>
      ${ex("What is the sum of the coefficients of (3x − 1)⁴?", "Plug in x = 1: (3 − 1)⁴ = <b>16</b>.", "contest style")}
      ${aops("Pascal%27s_Triangle", "Pascal's Triangle")}`,
    quiz: [

      num("What is the coefficient of x² in (x + 2)⁵?", 80, "C(5, 2) × 2³ = 10 × 8 = 80."),

    ${seg(102, 120, 90, 142, { w: 1.5 })}${seg(110, 120, 122, 142, { w: 1.5 })}${seg(152, 120, 140, 142, { w: 1.5 })}${seg(160, 120, 172, 142, { w: 1.5 })}
    ${txt(88, 158, "2", { fill: "var(--accent)" })}${txt(124, 158, "2", { fill: "var(--accent)" })}${txt(138, 158, "3", { fill: "var(--accent)" })}${txt(174, 158, "3", { fill: "var(--accent)" })}

function figClock7() {
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], pts = polyPts(7, 110, 105, 75);
  let s = circ(110, 105, 75, { c: "var(--line)" });
  pts.forEach((p, i) => { s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="19" fill="${i === 3 ? "var(--accent-soft)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="1.5"/>` + txt(p[0].toFixed(1), (p[1] + 4).toFixed(1), days[i], { size: 11 }); });
  s += txt(110, 100, "mod 7", { size: 12, fill: "var(--muted)" }) + txt(110, 116, "weeks wrap", { size: 11, fill: "var(--muted)" });
  return svg(220, 210, s, "Days of the week arranged in a circle, a clock with 7 positions");
}

  { name: "Distribute", eq: "a(b + c) = ab + ac" },
  { name: "Useful square", eq: "x² + 1/x² = (x + 1/x)² − 2" },
  { name: "Consecutive integers", eq: "write them as n − 1, n, n + 1 (the middle one is the average)" },
  { name: "Add all the equations", eq: "for symmetric systems, add everything first to get a + b + c" },
  { name: "Inequality with a negative", eq: "multiply or divide by a negative → flip the sign" },
  { name: "Absolute value", eq: "|x − a| ≤ b  ⇔  a − b ≤ x ≤ a + b", core: true },
  { name: "Slope", eq: "m = (y₂ − y₁) ÷ (x₂ − x₁)", core: true },
  { name: "Line", eq: "y = mx + b · parallel: same m · perpendicular: m₁m₂ = −1", core: true },
  { name: "Quadratic formula", eq: "x = (−b ± √(b² − 4ac)) ÷ 2a", core: true },
  { name: "Vieta's formulas (ax² + bx + c)", eq: "r + s = −b/a · rs = c/a", core: true },
  { name: "Sum of squares of roots", eq: "r² + s² = (r + s)² − 2rs" },
  { name: "Vertex of y = ax² + bx + c", eq: "x = −b ÷ 2a" },
  { name: "Discriminant", eq: "b² − 4ac: positive 2 roots · zero 1 root · negative none (real)" },
  { name: "Arithmetic sequence", eq: "aₙ = a₁ + (n − 1)d · sum = n(a₁ + aₙ) ÷ 2", core: true },
  { name: "Number of terms a, a + d, …, L", eq: "(L − a) ÷ d + 1" },
  { name: "1 + 2 + … + n", eq: "n(n + 1) ÷ 2", core: true },
  { name: "1 + 3 + 5 + … (n odd numbers)", eq: "n²" },
  { name: "Geometric sequence", eq: "aₙ = a₁ rⁿ⁻¹ · sum = a₁(rⁿ − 1) ÷ (r − 1)" },
];

function figLine() {
  // 3x + 4y = 24 with axes, intercepts (8,0), (0,6)
  const X = x => 30 + x * 26, Y = y => 190 - y * 26;
  let g = "";
  for (let x = 0; x <= 9; x++) g += seg(X(x), Y(0), X(x), Y(7), { c: "var(--line)", w: 1 });
  for (let y = 0; y <= 7; y++) g += seg(X(0), Y(y), X(9), Y(y), { c: "var(--line)", w: 1 });
  g += poly([[X(0), Y(0)], [X(8), Y(0)], [X(0), Y(6)]], { fill: "var(--hi-soft)", w: 0 });
  g += seg(X(0), Y(0), X(9), Y(0), { w: 1.5 }) + seg(X(0), Y(0), X(0), Y(7), { w: 1.5 });
  g += seg(X(-0.3), Y(6.225), X(9), Y(-0.75), { c: "var(--accent)", w: 3 });
  g += dot(X(8), Y(0), { c: "var(--accent)", r: 5 }) + dot(X(0), Y(6), { c: "var(--accent)", r: 5 });
  g += txt(X(8), Y(0) + 18, "(8, 0)", { size: 11 }) + txt(X(0) + 30, Y(6) - 6, "(0, 6)", { size: 11 }) + txt(X(2.5), Y(1.8), "area 24", { size: 12, fill: "var(--muted)" });
  return svg(280, 215, g, "The line 3x + 4y = 24 cuts the axes at (8, 0) and (0, 6)");
}
function figParabola() {
  // y = x² − 6x + 5 on x in [0,6]
  const X = x => 30 + x * 32, Y = y => 60 + (5 - y) * 22;
  let g = seg(X(0), Y(0), X(6.5), Y(0), { w: 1.5, c: "var(--muted)" }) + seg(X(0), Y(-4.5), X(0), Y(5.5), { w: 1.5, c: "var(--muted)" });
  let d = "";
  for (let x = 0; x <= 6.001; x += 0.1) d += (d ? " L" : "M") + X(x).toFixed(1) + " " + Y(x * x - 6 * x + 5).toFixed(1);
  g += pathEl(d, { c: "var(--accent)", w: 3 });
  g += dot(X(1), Y(0), { r: 5 }) + dot(X(5), Y(0), { r: 5 }) + dot(X(3), Y(-4), { r: 5, c: "var(--hi)" });
  g += txt(X(1), Y(0) - 10, "1") + txt(X(5), Y(0) - 10, "5") + txt(X(3), Y(-4) + 20, "vertex (3, −4)", { size: 11 });
  return svg(260, 280, g, "Parabola y = x² − 6x + 5 with roots 1 and 5 and vertex (3, −4)");
}

Object.assign(LESSONS, {

      <h3>Plugging in</h3>

      <h3>A useful square</h3>
      <p>Contests love expressions like x + 1/x. Square it: (x + 1/x)² = x² + 2 + 1/x².</p>

  { name: "Grouping", eq: "xy + ax + by + ab = (x + b)(y + a)" },
  { name: "Difference of squares", eq: "a² − b² = (a − b)(a + b)", core: true },
  { name: "Perfect squares", eq: "(a ± b)² = a² ± 2ab + b²", core: true },
  { name: "Sum of squares from a + b and ab", eq: "a² + b² = (a + b)² − 2ab" },
  { name: "Sum of cubes", eq: "a³ + b³ = (a + b)(a² − ab + b²)" },
  { name: "Difference of cubes", eq: "a³ − b³ = (a − b)(a² + ab + b²)" },
  { name: "Cube of a sum", eq: "(a + b)³ = a³ + 3a²b + 3ab² + b³ · a³ + b³ = (a + b)³ − 3ab(a + b)", core: true },
  { name: "Simon's Favorite Factoring Trick", eq: "xy + ax + by = c  →  (x + b)(y + a) = c + ab", core: true },
  { name: "Square of a three-term sum", eq: "(a + b + c)² = a² + b² + c² + 2(ab + bc + ca)" },
  { name: "Telescoping product", eq: "(x − 1)(x + 1)(x² + 1)(x⁴ + 1) = x⁸ − 1" },
];

function figDiffSquares() {
  // a² with a b² corner removed, rearranged as (a−b)(a+b)
  return svg(380, 160, `
    ${poly([[10, 10], [130, 10], [130, 70], [90, 70], [90, 130], [10, 130]])}

    ${txt(70, 148, "a")}${txt(110, 110, "b²", { fill: "var(--muted)" })}
    ${txt(185, 75, "→", { size: 22 })}
    ${poly([[220, 40], [370, 40], [370, 100], [220, 100]])}
    ${seg(320, 40, 320, 100, { dash: "4 3", w: 1.5, c: "var(--muted)" })}
    ${txt(295, 118, "a + b")}${txt(205, 75, "a−b", { size: 11 })}`, "A square of side a with a b by b corner removed rearranges into an (a − b) by (a + b) rectangle");
}

function figParallel() {
  return svg(320, 190, `
    ${seg(10, 50, 310, 50)}${seg(10, 140, 310, 140)}
    ${pathEl("M290 50 l-10 -5 M290 50 l-10 5", { w: 1.5 })}${pathEl("M290 140 l-10 -5 M290 140 l-10 5", { w: 1.5 })}
    ${seg(90, 185, 230, 5, { c: "var(--accent)" })}
    ${txt(214, 42, "1")}${txt(180, 42, "2", { fill: "var(--muted)" })}${txt(182, 68, "3")}${txt(214, 68, "4", { fill: "var(--muted)" })}
    ${txt(144, 132, "5")}${txt(110, 132, "6", { fill: "var(--muted)" })}${txt(112, 160, "7")}${txt(144, 160, "8", { fill: "var(--muted)" })}`,
    "Two parallel lines cut by a transversal, eight angles numbered");
}
function figClockFace(h = 3, m = 30) {
  let s = circ(100, 100, 85, { fill: "var(--surface)" });
  for (let i = 0; i < 12; i++) { const a = (i * 30 - 90) * Math.PI / 180; s += txt((100 + 70 * Math.cos(a)).toFixed(1), (105 + 70 * Math.sin(a)).toFixed(1), i || 12, { size: 12 }); }
  const ha = ((h % 12) * 30 + m * 0.5 - 90) * Math.PI / 180, ma = (m * 6 - 90) * Math.PI / 180;
  s += seg(100, 100, (100 + 42 * Math.cos(ha)).toFixed(1), (100 + 42 * Math.sin(ha)).toFixed(1), { w: 5 });
  s += seg(100, 100, (100 + 60 * Math.cos(ma)).toFixed(1), (100 + 60 * Math.sin(ma)).toFixed(1), { w: 3, c: "var(--accent)" });
  s += dot(100, 100, { r: 5 });
  return svg(200, 200, s, `Clock showing ${h}:${String(m).padStart(2, "0")}`);
}

function figCircleParts() {
  return svg(260, 220, `
    ${circ(120, 110, 90, { fill: "var(--surface)" })}${dot(120, 110)}
    ${seg(120, 110, 183.6, 46.4, { c: "var(--accent)" })}${txt(162, 92, "r", { fill: "var(--accent)" })}
    ${seg(30, 110, 210, 110, { c: "var(--hi)", w: 2.5 })}${txt(70, 104, "diameter", { size: 11 })}
    ${seg(56.4, 173.6, 183.6, 173.6, { w: 2 })}${txt(120, 168, "chord", { size: 11 })}
    ${seg(250, 0, 250, 220, { c: "var(--muted)", w: 1.5 })}${seg(30, 20, 30, 200, { c: "var(--muted)", w: 1.5, dash: "4 3" })}
    ${txt(236, 30, "tangent", { size: 11, fill: "var(--muted)", a: "end" })}`, "Circle with radius, diameter, chord and tangent line");
}
function figInscribed() {
  // circle center (110,110) r 85; arc AB at bottom, central angle 100°, inscribed point C at top
  const P = d => { const a = d * Math.PI / 180; return [+(110 + 85 * Math.cos(a)).toFixed(1), +(110 + 85 * Math.sin(a)).toFixed(1)]; };
  const A = P(40), B = P(140), C = P(270);
  return svg(220, 220, `
    ${circ(110, 110, 85, { fill: "var(--surface)" })}
    ${seg(110, 110, ...A, { c: "var(--accent)" })}${seg(110, 110, ...B, { c: "var(--accent)" })}
    ${seg(...C, ...A, { c: "var(--hi)" })}${seg(...C, ...B, { c: "var(--hi)" })}
    ${dot(110, 110)}${dot(...A)}${dot(...B)}${dot(...C)}
    ${txt(110, 140, "100°", { fill: "var(--accent)", size: 12 })}${txt(110, 50, "50°", { fill: "var(--ink)", size: 12 })}
    ${txt(A[0] + 10, A[1] + 12, "A")}${txt(B[0] - 10, B[1] + 12, "B")}${txt(C[0], C[1] - 8, "C")}`, "Central angle 100 degrees and inscribed angle 50 degrees on the same arc");
}
function figTangent() {
  return svg(300, 180, `
    ${circ(80, 90, 60, { fill: "var(--surface)" })}${dot(80, 90)}
    ${seg(80, 90, 260, 90, { c: "var(--muted)", w: 1.5, dash: "4 3" })}
    ${seg(260, 90, 100, 33.4, { c: "var(--accent)" })}${seg(260, 90, 100, 146.6, { c: "var(--accent)" })}
    ${seg(80, 90, 100, 33.4)}${dot(260, 90)}${txt(270, 94, "P", { a: "start" })}
    ${txt(170, 52, "equal", { fill: "var(--accent)", size: 12 })}${txt(170, 140, "tangents", { fill: "var(--accent)", size: 12 })}${txt(78, 58, "r", { size: 12 })}`, "Two tangent segments from point P to a circle are equal, and each meets a radius at a right angle");
}

FORMULAS["geo-area"] = [
  { name: "Rectangle · parallelogram", eq: "lw · bh (h is perpendicular height)" },
  { name: "Triangle", eq: "½ × base × height", core: true },
  { name: "Trapezoid", eq: "½ (b₁ + b₂) h", core: true },
  { name: "Heron's formula", eq: "√(s(s − a)(s − b)(s − c)),  s = (a + b + c)/2", note: "13-14-15 → 84 is the favorite" },
  { name: "Triangle with two sides and the angle between", eq: "½ ab sin C  (sin 30° = ½, sin 90° = 1)" },
  { name: "Pick's theorem (lattice polygon)", eq: "A = I + B/2 − 1", core: true },
  { name: "Shoelace formula", eq: "A = ½ |Σ (xᵢ yᵢ₊₁ − xᵢ₊₁ yᵢ)|" },
  { name: "Prism or cylinder volume", eq: "base area × height · cylinder πr²h", core: true },
  { name: "Pyramid or cone volume", eq: "⅓ × base area × height · cone ⅓πr²h", core: true },
  { name: "Sphere", eq: "V = (4/3)πr³ · S = 4πr²", core: true },
  { name: "Box surface area", eq: "2(lw + lh + wh)" },
  { name: "Cylinder surface area", eq: "2πr² + 2πrh" },
  { name: "Cone surface area", eq: "πr² + πrℓ (ℓ = slant height)" },
  { name: "Scaling by k", eq: "area × k² · volume × k³", core: true },
];

function figTrapezoid() {
  return svg(260, 150, `
    ${poly([[60, 20], [160, 20], [230, 120], [20, 120]])}
    ${seg(60, 20, 60, 120, { c: "var(--accent)", dash: "5 3" })}${rightMark(60, 120, 1, -1, 10)}
    ${txt(110, 14, "b₁ = 6")}${txt(125, 138, "b₂ = 10")}${txt(72, 76, "h", { fill: "var(--accent)", a: "start" })}`, "Trapezoid with parallel sides 6 and 10 and height h");
}
function figShadedSquare() {
  return svg(170, 170, `
    <rect x="15" y="15" width="140" height="140" fill="var(--hi-soft)" stroke="var(--ink)" stroke-width="2"/>
    ${circ(85, 85, 70, { fill: "var(--surface)" })}${txt(85, 90, "16 − 4π shaded", { size: 11, fill: "var(--muted)" })}`, "A circle inscribed in a square with the four corners shaded");
}
function figPick() {
  const X = x => 20 + x * 30, Y = y => 140 - y * 30;
  let g = "";
  for (let x = 0; x <= 6; x++) for (let y = 0; y <= 4; y++) g += dot(X(x), Y(y), { r: 2.5, c: "var(--muted)" });
  g = poly([[X(0), Y(0)], [X(6), Y(0)], [X(0), Y(4)]], { fill: "var(--accent-soft)" }) + g;
  [[1, 1], [2, 1], [3, 1], [4, 1], [1, 2], [2, 2], [1, 3]].forEach(([x, y]) => g += dot(X(x), Y(y), { r: 4.5, c: "var(--accent)" }));
  return svg(220, 160, g, "Lattice triangle with 7 interior points");
}
function figSolids() {
  return svg(380, 150, `
    <ellipse cx="60" cy="30" rx="40" ry="12" fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="2"/>
    ${seg(20, 30, 20, 120)}${seg(100, 30, 100, 120)}
    <path d="M20 120 A40 12 0 0 0 100 120" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${txt(60, 145, "cylinder πr²h", { size: 11 })}
    ${pathEl("M150 120 L190 25 L230 120")}<ellipse cx="190" cy="120" rx="40" ry="12" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${seg(190, 25, 190, 120, { c: "var(--accent)", dash: "4 3", w: 1.5 })}
    ${txt(190, 145, "cone ⅓πr²h", { size: 11 })}
    ${circ(320, 75, 45, { fill: "var(--hi-soft)" })}<ellipse cx="320" cy="75" rx="45" ry="12" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
    ${txt(320, 145, "sphere (4/3)πr³", { size: 11 })}`, "Cylinder, cone, and sphere with their volume formulas");
}

FORMULAS["arith"] = [
  { name: "Order of operations", eq: "( ) → exponents → × ÷ left to right → + − left to right" },
  { name: "Distributive shortcut", eq: "a×b + a×c = a×(b + c)  ·  17×23 + 17×77 = 1700" },
  { name: "\"Of\" means multiply", eq: "20% of 35% of 400 = 0.2 × 0.35 × 400 = 28" },
  { name: "Percent change", eq: "(new − old) ÷ old × 100%", core: true },
  { name: "Successive percents", eq: "multiply the factors: +20% then −20% → 1.2 × 0.8 = 0.96", core: true },
  { name: "Ratio a : b", eq: "total = a + b parts; one part = total ÷ (a + b)", core: true },
  { name: "Chaining ratios", eq: "a:b = 2:3, b:c = 4:5 → a:b:c = 8:12:15" },
  { name: "Mean", eq: "mean = sum ÷ count  ·  sum = mean × count", core: true },
  { name: "Median", eq: "middle of the sorted list (average the two middles if even)" },
  { name: "Squares ending in 5", eq: "(10a + 5)² = a(a + 1) | 25  ·  65² = 4225" },
  { name: "Near-square products", eq: "(n − k)(n + k) = n² − k²  ·  48 × 52 = 2496", core: true },
  { name: "Unit conversion", eq: "multiply by fractions equal to 1  ·  1 yd² = 9 ft², 1 yd³ = 27 ft³" },
  { name: "Speed conversion", eq: "60 mph = 88 ft/s  ·  30 mph = 44 ft/s" },
];

function figTape(parts, labels, cap) {
  const W = 300, x0 = 40, unit = (W - x0 - 10) / parts.reduce((a, b) => a + b, 0);
  let g = "", y = 18;
  parts.forEach((n, r) => {
    g += txt(x0 - 8, y + 17, labels[r], { a: "end", size: 12 });
    for (let i = 0; i < n; i++) g += `<rect x="${x0 + i * unit}" y="${y}" width="${unit}" height="26" fill="${r ? "var(--hi-soft)" : "var(--accent-soft)"}" stroke="var(--ink)" stroke-width="1.5"/>`;
    y += 36;
  });
  return svg(W, y + 4, g, cap);
}

FORMULAS["rates"] = [
  { name: "Distance, rate, time", eq: "d = r × t  ·  r = d ÷ t  ·  t = d ÷ r", core: true },
  { name: "Average speed", eq: "total distance ÷ total time (never the average of the speeds)", core: true },
  { name: "Same distance at speeds a and b", eq: "average speed = 2ab ÷ (a + b)" },
  { name: "Moving toward each other", eq: "closing speed = sum of the speeds", core: true },
  { name: "Chasing (same direction)", eq: "closing speed = difference of the speeds", core: true },
  { name: "Train passing a bridge", eq: "distance = bridge length + train length" },
  { name: "Work rates", eq: "rates add: 1/T = 1/a + 1/b  ·  together time = ab ÷ (a + b)", core: true },
  { name: "Fill and drain", eq: "net rate = fill rate − drain rate" },
  { name: "Mixtures", eq: "amount of pure stuff = percent × total amount", core: true },
  { name: "Clock hands", eq: "minute hand 6°/min · hour hand ½°/min · angle = |30h − 5.5m|", core: true },
  { name: "Hands overlap", eq: "every 12/11 hours (65 5/11 minutes)" },
  { name: "Calendar shift", eq: "365 days = 52 weeks + 1 day · leap year shifts 2 days" },
];

function figMeet() {
  return svg(320, 90, `
    ${seg(20, 50, 300, 50, { w: 3 })}
    ${dot(20, 50, { r: 6 })}${dot(300, 50, { r: 6 })}
    ${txt(20, 78, "A")}${txt(300, 78, "B")}
    ${pathEl("M40 30 L110 30", { c: "var(--accent)" })}<path d="M110 30 l-8 -5 v10 z" fill="var(--accent)"/>
    ${pathEl("M280 30 L210 30", { c: "var(--hi)" })}<path d="M210 30 l8 -5 v10 z" fill="var(--hi)"/>
    ${txt(75, 20, "40 mph", { fill: "var(--accent)", size: 12 })}${txt(245, 20, "50 mph", { fill: "var(--hi)", size: 12 })}
    ${txt(160, 78, "180 miles", { size: 12, fill: "var(--muted)" })}`, "Two cars 180 miles apart driving toward each other at 40 and 50 mph");
}

FORMULAS["prob"] = [
  { name: "Equally likely outcomes", eq: "P = favorable ÷ total", core: true },
  { name: "Complement", eq: "P(not A) = 1 − P(A)  ·  “at least one” → 1 − P(none)", core: true },
  { name: "Independent events", eq: "P(A and B) = P(A) × P(B)", core: true },
  { name: "Without replacement", eq: "multiply, shrinking the counts: 3/5 × 2/4" },
  { name: "Either-or", eq: "P(A or B) = P(A) + P(B) − P(A and B)" },
  { name: "Conditional", eq: "P(A | B) = P(A and B) ÷ P(B)  (shrink the sample space to B)", core: true },
  { name: "Expected value", eq: "E = Σ value × probability  ·  expected values add", core: true },
  { name: "Waiting for success", eq: "expected tries = 1 ÷ p  (a 6 on a die: 6 rolls)" },
  { name: "Geometric probability", eq: "favorable length or area ÷ total length or area", core: true },
  { name: "Two dice", eq: "36 outcomes; sum 7 has 6 ways; sum s (2 to 7) has s − 1 ways" },
];

function figDice() {
  const rows = [];
  for (let a = 1; a <= 6; a++) {
    const r = [`<b>${a}</b>`];
    for (let b = 1; b <= 6; b++) r.push(a + b === 7 ? `<b style="color:var(--accent)">${a + b}</b>` : String(a + b));
    rows.push(r);
  }
  return tbl(["+", "1", "2", "3", "4", "5", "6"], rows);
}
function figUnitSquare() {
  const X = x => 30 + x * 160, Y = y => 180 - y * 160;
  return svg(220, 210, `
    <rect x="${X(0)}" y="${Y(1)}" width="160" height="160" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    ${poly([[X(0), Y(0)], [X(0.5), Y(0)], [X(0), Y(0.5)]], { fill: "var(--accent-soft)", c: "var(--accent)" })}
    ${txt(X(0.13), Y(0.13) + 4, "x+y<½", { size: 10 })}
    ${txt(X(0), Y(0) + 18, "0")}${txt(X(1), Y(0) + 18, "1")}${txt(X(0) - 12, Y(1) + 4, "1")}
    ${txt(X(0.5), Y(0) + 18, "x")}${txt(X(0) - 12, Y(0.5) + 4, "y")}`, "Unit square with the triangle x + y < 1/2 shaded");
}

function figChessCorners() {
  let g = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const cut = (r === 0 && c === 0) || (r === 7 && c === 7);
    g += `<rect x="${10 + c * 18}" y="${10 + r * 18}" width="18" height="18" fill="${cut ? "none" : (r + c) % 2 ? "var(--ink)" : "var(--surface)"}" stroke="${cut ? "var(--muted)" : "var(--ink)"}" stroke-width="${cut ? 1 : 0.6}" ${cut ? 'stroke-dasharray="3 2"' : ""}/>`;
  }
  return svg(164, 164, g, "Chessboard with two opposite corners removed; both removed squares are the same color");
}
